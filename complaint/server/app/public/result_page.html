<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPEI AI 고소장 생성 서비스</title>
  <link rel="stylesheet" href="result_style.css" type="text/css">

  <style>
    /* 모바일 대응: result_style.css의 .container는 display:flex(가로)로
       버튼 영역(고정 260px)과 pdf-viewer를 나란히 배치하므로
       375~414px 화면에서 가로 스크롤이 발생함. 모바일에서는 세로로 쌓음 */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
        height: auto;
      }

      .button-container {
        flex: 0 0 auto;
        width: 100%;
      }

      .pdf-viewer {
        flex: 1 1 auto;
        width: 100%;
        min-height: 70vh;
      }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<script>
    const WORD_DOWNLOAD_URL = "word_download_url";
    const PDF_DOWNLOAD_URL = "pdf_download_url";

    function download_word() {
        window.location.href = WORD_DOWNLOAD_URL;
    }

    function download_pdf() {
        window.location.href = PDF_DOWNLOAD_URL;
    }

    function reset() {
        window.location.href = "/";
    }
</script>

<body>
    <h1>FPEI AI 고소장 생성 서비스</h1>
    <p class="model-name">
        AI 모델:
        <a href="MODEL_URL" target="_blank" rel="noopener noreferrer">
        <strong>MODEL_NAME</strong>
        </a>
    </p>

    <div class="container">
        <div class="button-container">
            <button onclick="download_word()">고소장 docx 다운로드</button>
            <p>고소장을 docx로 저장</p> </br>
            <button onclick="download_pdf()">고소장 pdf 다운로드</button>
            <p>고소장을 pdf로 저장</p> </br>
            <button onclick="reset()">처음으로 돌아가기</button>
            <p>첫 페이지로 복귀</p> </br>

        </div>

        <div class="pdf-viewer">
            <iframe src='pdf_url'> </iframe>
        </div>
    </div>
</body>
</html>
