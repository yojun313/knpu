<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>처리 중</title>
    <link rel="stylesheet" href="/loading.css">

    <style>
      /* 모바일 대응: loading.css의 .main은 box-sizing 미지정 + min-width:320px +
         좌우 padding 60px 조합으로 375px대 화면에서 가로 스크롤을 유발함 */
      @media (max-width: 480px) {
        .main {
          box-sizing: border-box;
          min-width: 0;
          width: 100%;
          max-width: 100%;
          padding: 32px 20px;
        }
      }
    </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B1226">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="고소장">
  <meta name="application-name" content="고소장">
  <link rel="stylesheet" href="/webapp.css">
</head>
<body>

    <div class="main">
        <h1>처리 중입니다</h1>
        <h2>AI가 고소장을 작성하고 있습니다.<br>잠시만 기다려주세요.</h2>

        <div class="loading_circle"></div>
    </div>

    <script> window.onload = function() { 
        // 페이지 로드 후 리디렉션
        window.location.href = '/llm'; 
    }; </script>

</body>
</html>
