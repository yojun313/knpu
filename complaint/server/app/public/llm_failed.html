<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 생성 실패</title>

  <!-- 기존 loading 페이지 CSS 그대로 사용 -->
  <link rel="stylesheet" href="/loading.css">

  <style>
    /* 모바일 대응: loading.css의 .main은 box-sizing 미지정 + min-width:320px +
       좌우 padding 60px 조합으로 375px대 화면에서 가로 스크롤을 유발함 */
    @media (max-width: 480px) {
      .main {
        box-sizing: border-box;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        padding: 32px 20px;
      }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div class="main">
    <h1>생성에 실패했습니다</h1>
    <h2>
      문서를 생성하는 중 오류가 발생했습니다.<br>
      다시 시도해 주세요.
    </h2>

    <!-- 실패 아이콘 (로딩 원 스타일 재활용) -->
    <div class="loading_circle" style="
      border-top-color:#c62828;
      animation: none;
    "></div>

    <!-- 버튼 영역 -->
    <div style="margin-top: 35px; display: flex; gap: 12px; justify-content: center;">
      <form action="/loading" method="post">
        <button type="submit" class="btn retry">
          다시 시도
        </button>
      </form>
      <button class="btn home" onclick="location.href='/'">
        처음으로
      </button>
    </div>
  </div>
</body>
</html>
