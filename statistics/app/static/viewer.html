<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Statistics Analyzer</title>
  <script>(function(){try{var m=document.cookie.match(/(?:^|; )ui_theme_style=([^;]*)/);var t=m?decodeURIComponent(m[1]):null;if(t&&t!=='default')document.documentElement.setAttribute('data-ui-theme',t);var mm=document.cookie.match(/(?:^|; )ui_theme_mode=([^;]*)/);if(mm&&decodeURIComponent(mm[1])==='dark')document.documentElement.setAttribute('data-ui-theme-mode','dark');var mn=document.cookie.match(/(?:^|; )ui_nav_visibility=([^;]*)/);if(mn&&decodeURIComponent(mn[1])==='autohide')document.documentElement.setAttribute('data-ui-nav','autohide');}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/viewer.css">
  <link rel="stylesheet" href="/shared-ui/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/shared-ui/favicon.ico">
</head><body>
  <div class="top-header">
    <a href="https://knpu.re.kr" title="홈으로"><img src="/img/lab_logo.png" alt="FPEI" class="top-header-logo"></a>
    <nav class="top-nav">
      <a href="https://knpu.re.kr" class="top-nav-link">HOME</a>
      <a href="https://manager.knpu.re.kr" class="top-nav-link" id="navManagerLink">MANAGER</a>
      <a href="https://crawler.knpu.re.kr" class="top-nav-link">CRAWLER</a>
      <a href="https://network.knpu.re.kr" class="top-nav-link">NETWORK</a>
      <a href="https://kemkim.knpu.re.kr" class="top-nav-link">KEMKIM</a>
      <a href="https://statistics.knpu.re.kr" class="top-nav-link active">STATISTICS</a>
      <a href="https://ahp.knpu.re.kr" class="top-nav-link">AHP</a>
    </nav>
    <button id="themeSettingsBtn" class="theme-settings-btn" type="button" title="테마 설정" aria-label="테마 설정">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div id="app">
    <div id="rail" class="rail">
      <div class="rail-head">
        <button id="railToggle" class="rail-toggle" title="사이드바 접기/펼치기">☰</button>
        <span class="rail-brand">내 프로젝트</span>
      </div>
      <div class="rail-actions-row">
        <button id="railUploadBtn" class="rail-upload" title="새 프로젝트">
          <span class="ru-icon">＋</span><span class="ru-text">새 프로젝트</span>
        </button>
        <button id="railNewFolderBtn" class="rail-new-folder-btn" title="새 폴더">📁</button>
      </div>
      <label id="railAdminAllToggle" class="rail-admin-toggle" hidden>
        <input type="checkbox" id="railAdminAllChk"><span class="rat-text">모든 사용자 프로젝트 보기</span>
      </label>
      <div id="railList" class="rail-list"></div>
      <div id="railEmpty" class="rail-empty" hidden>아직 프로젝트가 없습니다</div>
      <div id="railResizer" class="rail-resizer" title="드래그해서 너비 조절"></div>
      <div class="rail-foot">
        <span id="railUserName" class="rail-user"></span>
        <div class="rail-foot-actions">
          <a id="railManualBtn" class="rail-logout" href="/manual" title="매뉴얼">?</a>
          <button id="railLogout" class="rail-logout" title="로그아웃">⎋</button>
        </div>
      </div>
    </div>

    <div id="main">
      <div id="top">
        <button id="mobileRailBtn" class="mobile-icon-btn" title="프로젝트 목록">☰</button>
        <div class="brandmark"><span class="dot3"></span><span id="projectName">Statistics Analyzer</span></div>
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9fb0c4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="search" type="text" placeholder="표 검색...">
        </div>
      </div>

      <div id="content">
        <div id="loading"><div class="spin"></div><div>분석 결과를 불러오는 중...</div></div>
        <div id="emptyProject" class="empty-project">
          <div class="ep-icon">📊</div>
          <div class="ep-title">프로젝트를 선택하세요</div>
          <div class="ep-sub">왼쪽 목록에서 프로젝트를 클릭하거나, 새 프로젝트를 업로드하세요.</div>
          <button id="emptyUploadBtn" class="btn primary ep-btn">새 프로젝트</button>
        </div>

        <div id="dashboard" hidden>
          <div class="dash-head">
            <div class="dash-head-main">
              <h1 id="dashSource">-</h1>
              <div class="dash-badges">
                <span class="badge-pill" id="dashPlatform">-</span>
                <span class="badge-pill" id="dashCategory">-</span>
                <span class="badge-meta" id="dashGenerated">-</span>
                <span class="badge-meta" id="dashRows">-</span>
              </div>
            </div>
            <div class="dash-head-actions">
              <button class="btn" id="btnDownloadRaw">원본 zip 다운로드</button>
            </div>
          </div>

          <div id="tableGrid" class="table-grid"></div>
        </div>
      </div>
    </div>
    <div id="mobileBackdrop"></div>
  </div>

  <div id="railCtxMenu" class="ctx-menu" hidden>
    <button class="ctx-item" data-act="props"><span class="ctx-ico">ℹ</span><span>속성</span></button>
    <button class="ctx-item" data-act="rename"><span class="ctx-ico">✎</span><span>이름 변경</span></button>
    <button class="ctx-item" data-act="move"><span class="ctx-ico">📁</span><span>폴더로 이동</span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item danger" data-act="delete"><span class="ctx-ico">🗑</span><span>삭제</span></button>
  </div>

  <div id="moveFolderMenu" class="ctx-menu" hidden></div>

  <div id="propsModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="propsTitle">프로젝트 속성</span>
        <button id="propsModalClose" class="modal-close" title="닫기">×</button>
      </div>
      <div class="sec-body" id="propsBody" style="padding:16px 18px"></div>
    </div>
  </div>

  <div id="uploadModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span>새 프로젝트</span>
        <button id="uploadModalClose" class="modal-close" title="닫기">×</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabBtnZip" data-tab="zip">결과 zip 업로드</button>
        <button class="modal-tab" id="tabBtnAnalyze" data-tab="analyze">원본 CSV로 새로 분석</button>
        <button class="modal-tab" id="tabBtnCrawl" data-tab="crawl">크롤링 DB에서 선택</button>
      </div>

      <div id="tabZip" class="modal-tab-panel active">
        <label id="modalDropzone" class="modal-dropzone" for="modalFileInput">
          <input type="file" id="modalFileInput" accept=".zip" hidden>
          <div class="dz-icon">＋</div>
          <div class="dz-text">zip 파일을 여기로 끌어놓거나 클릭해서 선택하세요</div>
          <div class="dz-sub">metadata.json / csv_files / graphs 가 들어있는 결과 zip</div>
        </label>
        <div id="zipProgress" class="upload-progress" hidden>
          <div class="upload-progress-bar"><div id="zipProgressFill" class="upload-progress-fill"></div></div>
          <div id="zipProgressLabel" class="upload-progress-label">업로드 중... 0%</div>
        </div>
        <div id="zipConfirm" class="analyze-form" hidden>
          <div class="field"><label>프로젝트 이름</label><input type="text" id="zipProjectName"></div>
          <button class="btn primary" id="btnConfirmZip">프로젝트 만들기</button>
        </div>
        <div id="modalStatus" class="modal-status"></div>
      </div>

      <div id="tabAnalyze" class="modal-tab-panel">
        <label id="analyzeDropzone" class="modal-dropzone modal-dropzone-sm" for="analyzeFileInput">
          <input type="file" id="analyzeFileInput" accept=".csv" hidden>
          <div class="dz-icon">＋</div>
          <div class="dz-text" id="analyzeFileLabel">원본 CSV 파일을 선택하세요</div>
          <div class="dz-sub">Naver News / Naver Cafe / Google YouTube 크롤링 결과 CSV</div>
        </label>
        <div id="analyzeProgress" class="upload-progress" hidden>
          <div class="upload-progress-bar"><div id="analyzeProgressFill" class="upload-progress-fill"></div></div>
          <div id="analyzeProgressLabel" class="upload-progress-label">업로드 중... 0%</div>
        </div>
        <div id="analyzeForm" class="analyze-form" hidden>
          <div class="field"><label>프로젝트 이름</label><input type="text" id="analyzeProjectName"></div>
          <div class="field"><label>플랫폼</label>
            <select id="optPlatform"></select>
          </div>
          <div class="field"><label>분석 종류</label>
            <select id="optCategory"></select>
          </div>
          <button class="btn primary" id="btnStartAnalyze">분석 시작</button>
        </div>
        <div id="analyzeStatus" class="modal-status"></div>
      </div>

      <div id="tabCrawl" class="modal-tab-panel">
        <div id="crawlDbStep">
          <div class="crawl-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="crawlDbSearch" placeholder="키워드, DB 이름, 요청자로 검색">
          </div>
          <div id="crawlDbList" class="crawl-table-wrap"></div>
          <div id="crawlDbPager" class="crawl-pager"></div>
        </div>
        <div id="crawlFileStep" hidden>
          <div class="crawl-breadcrumb">
            <button class="btn" id="btnCrawlBack" type="button">← 목록</button>
            <span class="cb-name" id="crawlFileDbName"></span>
          </div>
          <div id="crawlFileList" class="crawl-table-wrap"></div>
        </div>
        <div id="crawlProgress" class="upload-progress" hidden>
          <div class="upload-progress-bar"><div id="crawlProgressFill" class="upload-progress-fill"></div></div>
          <div id="crawlProgressLabel" class="upload-progress-label">불러오는 중...</div>
        </div>
        <div id="crawlAnalyzeForm" class="analyze-form" hidden>
          <div class="field"><label>프로젝트 이름</label><input type="text" id="crawlProjectName"></div>
          <div class="field"><label>플랫폼</label>
            <select id="crawlOptPlatform"></select>
          </div>
          <div class="field"><label>분석 종류</label>
            <select id="crawlOptCategory"></select>
          </div>
          <button class="btn primary" id="btnCrawlStartAnalyze">분석 시작</button>
        </div>
        <div id="crawlStatus" class="modal-status"></div>
      </div>
    </div>
  </div>

  <div id="progressModal" class="modal-overlay" hidden>
    <div class="modal-card progress-card">
      <div class="modal-head">
        <span>통계 분석 진행 중</span>
        <button id="progressModalClose" class="modal-close" title="닫기" hidden>×</button>
      </div>
      <div class="progress-body">
        <div class="spin progress-spin" id="progressSpin"></div>
        <div id="progressLog" class="progress-log"></div>
      </div>
    </div>
  </div>

  <div id="exportModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span>PNG로 저장 — <span id="exportTargetTitle"></span></span>
        <button id="exportModalClose" class="modal-close" title="닫기">×</button>
      </div>
      <div class="analyze-form">
        <div class="field">
          <label>배율 (해상도)</label>
          <div class="option-row" id="exportScaleRow">
            <button type="button" class="option-btn" data-value="1">1x</button>
            <button type="button" class="option-btn active" data-value="2">2x</button>
            <button type="button" class="option-btn" data-value="3">3x</button>
            <button type="button" class="option-btn" data-value="4">4x</button>
          </div>
        </div>
        <div class="field">
          <label>배경</label>
          <div class="option-row" id="exportBgRow">
            <button type="button" class="option-btn" data-value="transparent">투명</button>
            <button type="button" class="option-btn active" data-value="theme">현재 테마</button>
            <button type="button" class="option-btn" data-value="white">흰색</button>
          </div>
        </div>
        <div class="field">
          <label>세부 표시</label>
          <div class="chk-row-export">
            <input type="checkbox" id="exportShowLegend" checked><label for="exportShowLegend">범례 표시</label>
          </div>
          <div class="chk-row-export">
            <input type="checkbox" id="exportShowTitle" checked><label for="exportShowTitle">제목 표시</label>
          </div>
        </div>
        <button class="btn primary" id="btnDownloadPng">PNG 다운로드</button>
      </div>
    </div>
  </div>

  <script src="/js/viewer.js"></script>
  <script src="/shared-ui/theme.js"></script>
</body></html>
