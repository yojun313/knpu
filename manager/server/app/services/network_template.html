<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Word Network</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
  :root{
    --brand:#2c3e50; --brand-dark:#1b2634; --brand-light:#34495e;
    --accent:#4C78A8; --accent-soft:#5b8fc7;
    --sidebar-bg:#1b2531; --sidebar-panel:#232f3f; --sidebar-panel2:#2a3849;
    --sidebar-border:#33445a; --sidebar-text:#e8ecf1; --sidebar-muted:#8b98a8;
    --canvas-c1:#ffffff; --canvas-c2:#eef1f4;
    --success:#3fb27f;
  }
  body.dark-theme{
    --canvas-c1:#141a24; --canvas-c2:#0c1017;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,'Pretendard','Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--sidebar-bg);color:var(--sidebar-text);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #app{display:flex;height:100vh;width:100vw}

  /* ===== canvas ===== */
  #net{flex:1;height:100%;position:relative;
    background:radial-gradient(ellipse at 50% 38%,var(--canvas-c1) 0%,var(--canvas-c2) 100%);
    transition:background .35s ease}
  #net canvas{outline:none}

  #top{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;gap:12px;align-items:center;
    z-index:5;flex-wrap:wrap;pointer-events:none}
  #top > *{pointer-events:auto}
  .brandmark{display:flex;align-items:center;gap:9px;background:rgba(27,38,52,.92);backdrop-filter:blur(8px);
    padding:9px 16px 9px 12px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.06)}
  .brandmark .dot3{width:9px;height:9px;border-radius:50%;background:var(--accent-soft);flex-shrink:0;
    box-shadow:0 0 0 4px rgba(76,120,168,.18)}
  .brandmark span{font-size:13.5px;font-weight:700;color:#fff;letter-spacing:.2px}
  .search{position:relative}
  .search input{width:230px;padding:10px 14px 10px 36px;border-radius:11px;border:1px solid rgba(255,255,255,.08);
    background:rgba(27,38,52,.92);backdrop-filter:blur(8px);color:#fff;font-size:13.5px;outline:none;
    box-shadow:0 4px 16px rgba(0,0,0,.18);transition:.15s}
  .search input::placeholder{color:#7c8ba0}
  .search input:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px rgba(76,120,168,.28),0 4px 16px rgba(0,0,0,.18);width:270px}
  .search svg{position:absolute;left:12px;top:11px;opacity:.55;pointer-events:none}
  .badge{font-size:12px;font-weight:600;color:#dfe6ee;background:rgba(27,38,52,.92);backdrop-filter:blur(8px);
    padding:9px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.06);box-shadow:0 4px 16px rgba(0,0,0,.18);
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0;
    box-shadow:0 0 0 3px rgba(63,178,127,.22)}
  .badge.warn{color:#ffd7c2}
  .badge.warn .pulse{background:#e08a52;box-shadow:0 0 0 3px rgba(224,138,82,.22)}

  #zoombox{position:absolute;bottom:22px;left:22px;z-index:5;display:flex;flex-direction:column;gap:2px;
    background:rgba(27,38,52,.92);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;padding:7px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
  #zoombox button{width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:#dfe6ee;
    font-size:17px;cursor:pointer;line-height:1;transition:.12s}
  #zoombox button:hover{background:var(--accent);color:#fff}
  #zoomval{font-size:9.5px;text-align:center;color:#8b98a8;padding:2px 0;font-variant-numeric:tabular-nums;letter-spacing:.3px}

  /* ===== sidebar ===== */
  #side{width:336px;background:var(--sidebar-bg);border-left:1px solid var(--sidebar-border);
    display:flex;flex-direction:column;overflow-y:auto;color:var(--sidebar-text)}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-track{background:transparent}
  #side::-webkit-scrollbar-thumb{background:#3a4a5f;border-radius:10px}
  #side::-webkit-scrollbar-thumb:hover{background:#48607c}

  .title-block{padding:20px;border-bottom:1px solid var(--sidebar-border);display:flex;
    justify-content:space-between;align-items:flex-start;background:linear-gradient(180deg,var(--sidebar-panel),var(--sidebar-bg))}
  .title-block h1{font-size:16.5px;font-weight:800;letter-spacing:.2px;color:#fff}
  .title-block p{font-size:11.5px;color:var(--sidebar-muted);margin-top:4px}
  .icon-btn{background:var(--sidebar-panel2);border:1px solid var(--sidebar-border);border-radius:9px;
    width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--sidebar-text);flex-shrink:0;transition:.15s}
  .icon-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

  details{border-bottom:1px solid var(--sidebar-border)}
  details > summary{padding:14px 20px;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;
    color:var(--sidebar-muted);font-weight:700;list-style:none;user-select:none;display:flex;
    justify-content:space-between;align-items:center;transition:.12s}
  details > summary::-webkit-details-marker{display:none}
  details > summary::after{content:'';width:7px;height:7px;border-right:1.6px solid var(--sidebar-muted);
    border-bottom:1.6px solid var(--sidebar-muted);transform:rotate(45deg);transition:.18s;margin-left:8px}
  details[open] > summary::after{transform:rotate(225deg)}
  details > summary:hover{color:#fff;background:rgba(255,255,255,.02)}
  .sec-body{padding:2px 20px 18px}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
  .row label{color:var(--sidebar-muted);flex-shrink:0}
  .row .val{color:#fff;font-variant-numeric:tabular-nums;font-size:11px;min-width:34px;text-align:right;
    background:var(--sidebar-panel2);padding:2px 7px;border-radius:6px;font-weight:600}

  input[type=range]{-webkit-appearance:none;flex:1;height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--sidebar-panel2) 0%);outline:none;min-width:60px;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;cursor:pointer;border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:transform .12s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;
    border:3px solid var(--accent);cursor:pointer}

  select, input[type=number]{background:var(--sidebar-panel2);color:var(--sidebar-text);
    border:1px solid var(--sidebar-border);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none;
    transition:.12s}
  select:focus, input[type=number]:focus{border-color:var(--accent-soft)}
  select{width:100%;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b98a8'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:28px}
  input[type=number]{width:70px}
  input[type=color]{width:34px;height:28px;border:1px solid var(--sidebar-border);border-radius:7px;padding:2px;
    background:var(--sidebar-panel2);cursor:pointer}

  .pairnum{display:flex;gap:8px;align-items:center}
  .pairnum span{font-size:11px;color:var(--sidebar-muted)}
  .chk-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:12.5px}
  .chk-row label{color:#dfe6ee;cursor:pointer}
  .chk-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .btn{background:var(--sidebar-panel2);color:#fff;border:1px solid var(--sidebar-border);padding:9px 12px;
    border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s;width:100%;margin-bottom:8px}
  .btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-soft)}

  .node-title{font-size:21px;font-weight:800;margin-bottom:4px;color:#fff;word-break:break-all}
  .node-sub{font-size:12px;color:var(--sidebar-muted);margin-bottom:16px;display:flex;align-items:center;gap:6px}
  .node-sub .chip{background:var(--sidebar-panel2);padding:2px 8px;border-radius:20px;font-weight:600;color:#dfe6ee}
  .metric{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--sidebar-border);font-size:12.5px}
  .metric span:first-child{color:var(--sidebar-muted)}
  .metric span:last-child{font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
  .empty{color:var(--sidebar-muted);font-size:12.5px;text-align:center;padding:34px 10px;line-height:1.7}
  .empty svg{opacity:.35;margin-bottom:10px}

  .legend-item{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-bottom:3px;cursor:pointer;
    padding:7px 8px;border-radius:8px;transition:.12s}
  .legend-item:hover{background:var(--sidebar-panel2)}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
  .legend-item .cnt{margin-left:auto;color:var(--sidebar-muted);font-size:11px;font-variant-numeric:tabular-nums}

  .subgrid{display:none;margin-top:-2px}
  .subgrid.show{display:block}
  ::selection{background:rgba(76,120,168,.35)}
  </style></head><body>
  <div id="app">
    <div id="net">
      <div id="zoombox">
        <button id="btnZoomIn" title="확대">+</button>
        <div id="zoomval">100%</div>
        <button id="btnZoomOut" title="축소">−</button>
        <button id="btnZoomReset" title="전체보기">⤢</button>
      </div>
    </div>
    <div id="top">
      <div class="brandmark"><span class="dot3"></span><span>Word Network</span></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9fb0c4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search" type="text" placeholder="단어 검색...">
      </div>
      <div class="badge warn" id="totalBadge"><span class="pulse"></span>__WARN__</div>
      <div class="badge" id="liveBadge"><span class="pulse"></span>표시 중 -</div>
    </div>
    <div id="side">
      <div class="title-block">
        <div><h1>Word Network</h1><p>공출현 기반 단어 네트워크</p></div>
        <button class="icon-btn" id="btnTheme" title="캔버스 테마 전환">◐</button>
      </div>

      <details open>
        <summary>노드 정보</summary>
        <div class="sec-body"><div id="detail">
          <div class="empty">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8b98a8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.4" fill="#8b98a8"/></svg><br>
            노드를 클릭하면<br>상세 지표가 표시됩니다
          </div>
        </div></div>
      </details>

      <details open>
        <summary>필터</summary>
        <div class="sec-body">
          <div class="row"><label>엣지 가중치 ≥</label><span class="val" id="wv">0</span></div>
          <input id="wslider" type="range" min="0" max="__MAXW__" value="0" step="__STEP__" style="width:100%;margin-bottom:12px">
          <div class="row"><label>노드 최소 빈도 ≥</label><span class="val" id="fv">0</span></div>
          <input id="fslider" type="range" min="0" max="__MAXFREQ__" value="0" step="1" style="width:100%">
          <div class="chk-row" style="margin-top:14px">
            <input type="checkbox" id="chkHideIsolated">
            <label for="chkHideIsolated">연결 없는(고립) 노드 숨기기</label>
          </div>
        </div>
      </details>

      <details>
        <summary>노드 모양 · 크기</summary>
        <div class="sec-body">
          <div class="row"><label>모양</label></div>
          <select id="selShape" style="margin-bottom:12px">
            <option value="circle">circle (원, 라벨에 맞춰 자동)</option>
            <option value="dot">dot (원, 값기반 크기)</option>
            <option value="ellipse">ellipse (타원)</option>
            <option value="box">box (사각형)</option>
            <option value="diamond">diamond (다이아몬드)</option>
            <option value="star">star (별)</option>
            <option value="triangle">triangle (삼각형)</option>
            <option value="square">square (정사각형)</option>
          </select>
          <div class="row"><label>크기 기준</label></div>
          <select id="selSizeBy" style="margin-bottom:12px"></select>
          <div class="row"><label>크기 범위 (dot/star 등)</label></div>
          <div class="pairnum" style="margin-bottom:12px">
            <span>min</span><input type="number" id="numSizeMin" value="6" min="1" max="200">
            <span>max</span><input type="number" id="numSizeMax" value="55" min="1" max="300">
          </div>
          <div class="row"><label>테두리 두께</label><span class="val" id="borderWidthVal">1.5</span></div>
          <input type="range" id="rangeBorderWidth" min="0" max="6" step="0.5" value="1.5" style="width:100%;margin-bottom:12px">
          <div class="row"><label>테두리 색</label><input type="color" id="colorBorder" value="#ffffff"></div>
        </div>
      </details>

      <details>
        <summary>노드 색상</summary>
        <div class="sec-body">
          <div class="row"><label>색상 기준</label></div>
          <select id="selColorBy" style="margin-bottom:12px">
            <option value="community">커뮤니티별 팔레트</option>
            <option value="uniform">단일 색상</option>
            <option value="gradient">지표 기반 그라디언트</option>
          </select>
          <div class="subgrid" id="gridUniform">
            <div class="row"><label>색상</label><input type="color" id="colorUniform" value="#4C78A8"></div>
          </div>
          <div class="subgrid" id="gridGradient">
            <div class="row"><label>기준 지표</label></div>
            <select id="selGradMetric" style="margin-bottom:10px"></select>
            <div class="row"><label>낮은 값</label><input type="color" id="colorGradLow" value="#dbe9f6"></div>
            <div class="row"><label>높은 값</label><input type="color" id="colorGradHigh" value="#1428A0"></div>
          </div>
        </div>
      </details>

      <details>
        <summary>라벨</summary>
        <div class="sec-body">
          <div class="chk-row"><input type="checkbox" id="chkLabelShow" checked><label for="chkLabelShow">라벨 표시</label></div>
          <div class="row"><label>글자 크기</label><span class="val" id="fontSizeVal">14</span></div>
          <input type="range" id="rangeFontSize" min="8" max="36" step="1" value="14" style="width:100%;margin-bottom:12px">
          <div class="row"><label>글자 색</label><input type="color" id="colorFont" value="#2c3e50"></div>
        </div>
      </details>

      <details>
        <summary>엣지</summary>
        <div class="sec-body">
          <div class="row"><label>색상</label><input type="color" id="colorEdge" value="#9fb0c4"></div>
          <div class="row"><label>불투명도</label><span class="val" id="edgeOpVal">0.55</span></div>
          <input type="range" id="rangeEdgeOpacity" min="0.05" max="1" step="0.05" value="0.55" style="width:100%;margin-bottom:12px">
          <div class="row"><label>두께 범위</label></div>
          <div class="pairnum" style="margin-bottom:12px">
            <span>min</span><input type="number" id="numEdgeMin" value="0.5" min="0.1" max="20" step="0.1">
            <span>max</span><input type="number" id="numEdgeMax" value="6" min="0.5" max="40" step="0.5">
          </div>
          <div class="chk-row"><input type="checkbox" id="chkEdgeSmooth"><label for="chkEdgeSmooth">곡선(curve) 엣지</label></div>
          <div class="chk-row"><input type="checkbox" id="chkArrows"><label for="chkArrows">화살표 표시</label></div>
        </div>
      </details>

      <details>
        <summary>물리 엔진</summary>
        <div class="sec-body">
          <div class="chk-row"><input type="checkbox" id="chkPhysics"><label for="chkPhysics">물리 엔진 사용</label></div>
          <div class="row"><label>솔버</label></div>
          <select id="selSolver" style="margin-bottom:12px">
            <option value="barnesHut">barnesHut (기본)</option>
            <option value="forceAtlas2Based">forceAtlas2Based</option>
            <option value="repulsion">repulsion</option>
          </select>
          <div class="row"><label>중력(밀어내기)</label><span class="val" id="gravityVal">-12000</span></div>
          <input type="range" id="rangeGravity" min="-50000" max="-500" step="500" value="-12000" style="width:100%;margin-bottom:10px">
          <div class="row"><label>스프링 길이</label><span class="val" id="springLenVal">120</span></div>
          <input type="range" id="rangeSpringLen" min="30" max="400" step="5" value="120" style="width:100%;margin-bottom:10px">
          <div class="row"><label>스프링 강도</label><span class="val" id="springConstVal">0.04</span></div>
          <input type="range" id="rangeSpringConst" min="0.01" max="0.5" step="0.01" value="0.04" style="width:100%;margin-bottom:10px">
          <div class="row"><label>감쇠(damping)</label><span class="val" id="dampingVal">0.09</span></div>
          <input type="range" id="rangeDamping" min="0" max="1" step="0.01" value="0.09" style="width:100%;margin-bottom:12px">
          <button class="btn" id="btnRestabilize">레이아웃 다시 배치</button>
        </div>
      </details>

      <details>
        <summary>보기 · 조작</summary>
        <div class="sec-body">
          <div class="chk-row"><input type="checkbox" id="chkZoomWheel" checked><label for="chkZoomWheel">휠로 확대/축소</label></div>
          <div class="chk-row"><input type="checkbox" id="chkDragNodes" checked><label for="chkDragNodes">노드 드래그 허용</label></div>
          <button class="btn" id="btnFit">전체 보기</button>
          <div class="row" style="margin-top:4px"><label>배경(중심)</label><input type="color" id="colorBgCenter" value="#ffffff"></div>
          <div class="row"><label>배경(외곽)</label><input type="color" id="colorBgEdge" value="#eef1f4"></div>
        </div>
      </details>

      <details>
        <summary>커뮤니티 (<span id="commCount">__NC__</span>개)</summary>
        <div class="sec-body"><div id="legend"></div></div>
      </details>

      <details>
        <summary>내보내기 · 초기화</summary>
        <div class="sec-body">
          <button class="btn primary" id="btnExportPng">PNG로 저장</button>
          <button class="btn" id="btnResetSettings">모든 설정 초기화</button>
        </div>
      </details>
    </div>
  </div>
  <script>
    var rawNodes=__NODES__, rawEdges=__EDGES__;
    var palette=__PALETTE__;
  
    var mnames={value:'빈도(freq)',degree:'연결 정도',strength:'강도',betweenness:'매개 중심성',
      closeness:'근접 중심성',eigenvector:'고유벡터',pagerank:'PageRank',
      coreness:'k-core',constraint:'구조적 공백'};
    var metricKeys=['value'];
    (function(){
      var seen={value:true};
      rawNodes.forEach(function(n){
        if(!n.info)return;
        Object.keys(n.info).forEach(function(k){
          if(!seen[k]){seen[k]=true;metricKeys.push(k);}
        });
      });
    })();
  
    function getMetricValue(n,key){
      if(key==='value')return n.value;
      var v=n.info?n.info[key]:null;
      return (typeof v==='number')?v:0;
    }
  
    function metricRangeOf(key){
      var mn=Infinity,mx=-Infinity;
      rawNodes.forEach(function(n){var v=getMetricValue(n,key);if(v<mn)mn=v;if(v>mx)mx=v;});
      if(!isFinite(mn)){mn=0;mx=1;}
      return {min:mn,max:mx};
    }
  
    var maxFreq=metricRangeOf('value').max;
    document.getElementById('fslider').max=Math.ceil(maxFreq);
  
    ['selSizeBy','selGradMetric'].forEach(function(id){
      var sel=document.getElementById(id);
      metricKeys.forEach(function(k){
        var o=document.createElement('option');o.value=k;o.text=mnames[k]||k;sel.appendChild(o);
      });
    });
  
    function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');
      var num=parseInt(h,16);return [num>>16&255,num>>8&255,num&255];}
    function clamp255(x){return Math.max(0,Math.min(255,Math.round(x)));}
    function rgbToHex(r,g,b){return '#'+[r,g,b].map(function(x){var s=clamp255(x).toString(16);return s.length<2?'0'+s:s;}).join('');}
    function lerpColor(a,b,t){var A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
  
    var defaultCfg={
      shape:'circle', sizeBy:'value', sizeMin:6, sizeMax:55,
      colorBy:'community', colorUniform:'#4C78A8',
      colorGradMetric:'value', colorGradLow:'#dbe9f6', colorGradHigh:'#1428A0',
      borderWidth:1.5, borderColor:'#ffffff',
      labelShow:true, fontSize:14, fontColor:'#2c3e50',
      edgeColor:'#9fb0c4', edgeOpacity:0.55, edgeWidthMin:0.5, edgeWidthMax:6,
      edgeSmooth:false, arrows:false,
      physics:false, solver:'barnesHut', gravity:-12000, springLength:120, springConstant:0.04, damping:0.09,
      zoomWheel:true, dragNodes:true,
      bgCenter:'#ffffff', bgEdge:'#eef1f4', theme:'light',
      minWeight:0, minFreq:0, hideIsolated:false
    };
    var cfg=Object.assign({}, defaultCfg);
  
    var nodes=new vis.DataSet([]);
    var edges=new vis.DataSet([]);
    var container=document.getElementById('net');
  
    var nodeMap={}; rawNodes.forEach(function(n){nodeMap[n.id]=n;});
    var currentVisibleIds={};
    var communityCounts={};
    rawNodes.forEach(function(n){communityCounts[n.group]=(communityCounts[n.group]||0)+1;});
  
    function syncControlsFromCfg(){
      document.getElementById('selShape').value=cfg.shape;
      document.getElementById('selSizeBy').value=cfg.sizeBy;
      document.getElementById('numSizeMin').value=cfg.sizeMin;
      document.getElementById('numSizeMax').value=cfg.sizeMax;
      document.getElementById('rangeBorderWidth').value=cfg.borderWidth;
      document.getElementById('borderWidthVal').innerText=cfg.borderWidth;
      document.getElementById('colorBorder').value=cfg.borderColor;
      document.getElementById('selColorBy').value=cfg.colorBy;
      document.getElementById('colorUniform').value=cfg.colorUniform;
      document.getElementById('selGradMetric').value=cfg.colorGradMetric;
      document.getElementById('colorGradLow').value=cfg.colorGradLow;
      document.getElementById('colorGradHigh').value=cfg.colorGradHigh;
      document.getElementById('gridUniform').classList.toggle('show', cfg.colorBy==='uniform');
      document.getElementById('gridGradient').classList.toggle('show', cfg.colorBy==='gradient');
      document.getElementById('chkLabelShow').checked=cfg.labelShow;
      document.getElementById('rangeFontSize').value=cfg.fontSize;
      document.getElementById('fontSizeVal').innerText=cfg.fontSize;
      document.getElementById('colorFont').value=cfg.fontColor;
      document.getElementById('colorEdge').value=cfg.edgeColor;
      document.getElementById('rangeEdgeOpacity').value=cfg.edgeOpacity;
      document.getElementById('edgeOpVal').innerText=cfg.edgeOpacity.toFixed(2);
      document.getElementById('numEdgeMin').value=cfg.edgeWidthMin;
      document.getElementById('numEdgeMax').value=cfg.edgeWidthMax;
      document.getElementById('chkEdgeSmooth').checked=cfg.edgeSmooth;
      document.getElementById('chkArrows').checked=cfg.arrows;
      document.getElementById('chkPhysics').checked=cfg.physics;
      document.getElementById('selSolver').value=cfg.solver;
      document.getElementById('rangeGravity').value=cfg.gravity;
      document.getElementById('gravityVal').innerText=cfg.gravity;
      document.getElementById('rangeSpringLen').value=cfg.springLength;
      document.getElementById('springLenVal').innerText=cfg.springLength;
      document.getElementById('rangeSpringConst').value=cfg.springConstant;
      document.getElementById('springConstVal').innerText=cfg.springConstant.toFixed(2);
      document.getElementById('rangeDamping').value=cfg.damping;
      document.getElementById('dampingVal').innerText=cfg.damping.toFixed(2);
      document.getElementById('chkZoomWheel').checked=cfg.zoomWheel;
      document.getElementById('chkDragNodes').checked=cfg.dragNodes;
      document.getElementById('colorBgCenter').value=cfg.bgCenter;
      document.getElementById('colorBgEdge').value=cfg.bgEdge;
      document.getElementById('wslider').value=cfg.minWeight;
      document.getElementById('wv').innerText=cfg.minWeight.toFixed(1);
      document.getElementById('fslider').value=cfg.minFreq;
      document.getElementById('fv').innerText=cfg.minFreq;
      document.getElementById('chkHideIsolated').checked=cfg.hideIsolated;
    }
  
    function applyBackground(){
      container.style.background='radial-gradient(ellipse at 50% 38%,'+cfg.bgCenter+' 0%,'+cfg.bgEdge+' 100%)';
    }
  
    function computeNodeColor(n){
      if(cfg.colorBy==='community')return n.color;
      if(cfg.colorBy==='uniform')return cfg.colorUniform;
      var r=metricRangeOf(cfg.colorGradMetric);
      var val=getMetricValue(n,cfg.colorGradMetric);
      var t=(val-r.min)/((r.max-r.min)||1);
      return lerpColor(cfg.colorGradLow,cfg.colorGradHigh,Math.max(0,Math.min(1,t)));
    }
  
    // ⭐️ 핵심 변경 3: 데이터를 지우지(clear) 않고 갱신(update)만 하도록 처리하여 시야 초기화 버그 차단
    function renderGraph(){
      var filteredNodes=rawNodes.filter(function(n){return n.value>=cfg.minFreq;});
      var idSet={}; filteredNodes.forEach(function(n){idSet[n.id]=true;});
      var filteredEdges=rawEdges.filter(function(e){return e.value>=cfg.minWeight && idSet[e.from] && idSet[e.to];});
  
      if(cfg.hideIsolated){
        var connected={};
        filteredEdges.forEach(function(e){connected[e.from]=true;connected[e.to]=true;});
        filteredNodes=filteredNodes.filter(function(n){return connected[n.id];});
        idSet={}; filteredNodes.forEach(function(n){idSet[n.id]=true;});
        filteredEdges=filteredEdges.filter(function(e){return idSet[e.from] && idSet[e.to];});
      }
  
      currentVisibleIds={}; filteredNodes.forEach(function(n){currentVisibleIds[n.id]=true;});
  
      var strokeColor=cfg.theme==='dark' ? '#0c1017' : '#ffffff';
  
      var displayNodes=filteredNodes.map(function(n){
        return {
          id:n.id,
          label:cfg.labelShow ? n.label : undefined,
          value:getMetricValue(n,cfg.sizeBy),
          shape:cfg.shape,
          color:{background:computeNodeColor(n), border:cfg.borderColor,
            highlight:{background:computeNodeColor(n), border:'#4C78A8'}},
          borderWidth:cfg.borderWidth,
          font:{color:cfg.fontColor, size:cfg.fontSize, face:'Malgun Gothic', strokeWidth:3, strokeColor:strokeColor},
          x:n.x, y:n.y
        };
      });
  
      var edgeIdSeen={};
      var displayEdges=filteredEdges.map(function(e){
        var base=e.from + "_" + e.to;
        var n=(edgeIdSeen[base]=(edgeIdSeen[base]||0)+1);
        var id=n>1 ? base+"_"+n : base;
        return {id:id, from:e.from, to:e.to, value:e.value};
      });
  
      // 노드 스마트 업데이트 (필요 없는 것만 삭제하고 나머지는 속성만 갱신)
      var newNodeIds = displayNodes.map(function(n){return n.id;});
      var oldNodeIds = nodes.getIds();
      var nodesToRemove = oldNodeIds.filter(function(id){return newNodeIds.indexOf(id)===-1;});
      nodes.update(displayNodes);
      if(nodesToRemove.length > 0) nodes.remove(nodesToRemove);
  
      // 엣지 스마트 업데이트
      var newEdgeIds = displayEdges.map(function(e){return e.id;});
      var oldEdgeIds = edges.getIds();
      var edgesToRemove = oldEdgeIds.filter(function(id){return newEdgeIds.indexOf(id)===-1;});
      edges.update(displayEdges);
      if(edgesToRemove.length > 0) edges.remove(edgesToRemove);
  
      document.getElementById('liveBadge').innerHTML='<span class="pulse"></span>표시 중 '+filteredNodes.length.toLocaleString()+'개 노드 · '+filteredEdges.length.toLocaleString()+'개 엣지';
    }
  
    function getNetworkOptions() {
      return {
        layout: { improvedLayout: false },
        nodes: {
          scaling: { min: cfg.sizeMin, max: cfg.sizeMax }
        },
        edges: {
          color: { color: cfg.edgeColor, highlight: cfg.theme==='dark' ? '#8fb3dd' : '#2c3e50', opacity: cfg.edgeOpacity },
          smooth: cfg.edgeSmooth ? { type: 'continuous' } : false,
          arrows: { to: { enabled: cfg.arrows } },
          scaling: { min: cfg.edgeWidthMin, max: cfg.edgeWidthMax },
          selectionWidth: 2
        },
        physics: {
          enabled: cfg.physics,
          solver: cfg.solver,
          barnesHut: { gravitationalConstant: cfg.gravity, springLength: cfg.springLength, springConstant: cfg.springConstant, damping: cfg.damping },
          forceAtlas2Based: { gravitationalConstant: cfg.gravity, springLength: cfg.springLength, springConstant: cfg.springConstant, damping: cfg.damping },
          repulsion: { springLength: cfg.springLength, springConstant: cfg.springConstant, damping: cfg.damping }
        },
        interaction: { zoomView: cfg.zoomWheel, dragNodes: cfg.dragNodes, hover: true, tooltipDelay: 120, navigationButtons: false, keyboard: false }
      };
    }
  
    syncControlsFromCfg();
    applyBackground();
    renderGraph();
  
    var net = new vis.Network(container, {nodes:nodes, edges:edges}, getNetworkOptions());
  
    function applyOptions(){
      if(net) {
        net.setOptions(getNetworkOptions());
        net.redraw(); // 강제 렌더링을 호출하여 엣지 색상 변경 즉각 반영
      }
    }
  
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  
    function showDetail(n){
      if(!currentVisibleIds[n.id]){
        document.getElementById('detail').innerHTML='<div class="empty">현재 필터에 의해<br>숨겨진 노드입니다</div>';
        return;
      }
      var h='<div class="node-title">'+esc(n.label)+'</div>'+
        '<div class="node-sub"><span class="chip">커뮤니티 '+n.group+'</span><span>빈도 '+n.value+'</span></div>';
      var info=n.info||{};
      Object.keys(info).forEach(function(k){
        if(info[k]==null)return;
        h+='<div class="metric"><span>'+(mnames[k]||k)+'</span><span>'+info[k]+'</span></div>';
      });
      document.getElementById('detail').innerHTML=h;
      net.selectNodes([n.id]);
      net.focus(n.id,{scale:1.1,animation:{duration:400}});
    }
  
    net.on('click',function(p){
      if(p.nodes.length){showDetail(nodeMap[p.nodes[0]]);}
      else{document.getElementById('detail').innerHTML='<div class="empty"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8b98a8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.4" fill="#8b98a8"/></svg><br>노드를 클릭하면<br>상세 지표가 표시됩니다</div>';}
    });
  
    document.getElementById('search').addEventListener('input',function(e){
      var q=e.target.value.trim();
      if(!q){net.unselectAll();return;}
      var hit=rawNodes.filter(function(n){return n.label.indexOf(q)>=0;});
      if(hit.length){
        showDetail(hit[0]);
      }else{
        net.unselectAll();
        document.getElementById('detail').innerHTML='<div class="empty">"'+esc(q)+'"과(와)<br>일치하는 단어가 없습니다</div>';
      }
    });
  
    document.getElementById('wslider').addEventListener('input',function(e){
      cfg.minWeight=parseFloat(e.target.value);
      document.getElementById('wv').innerText=cfg.minWeight.toFixed(1);
      renderGraph();
    });
    document.getElementById('fslider').addEventListener('input',function(e){
      cfg.minFreq=parseFloat(e.target.value);
      document.getElementById('fv').innerText=cfg.minFreq;
      renderGraph();
    });
    document.getElementById('chkHideIsolated').addEventListener('change',function(e){
      cfg.hideIsolated=e.target.checked; renderGraph();
    });
  
    document.getElementById('selShape').addEventListener('change',function(e){cfg.shape=e.target.value; renderGraph();});
    document.getElementById('selSizeBy').addEventListener('change',function(e){cfg.sizeBy=e.target.value; renderGraph();});
    document.getElementById('numSizeMin').addEventListener('change',function(e){
      var v=parseFloat(e.target.value)||1;
      cfg.sizeMin=Math.min(v, cfg.sizeMax);
      e.target.value=cfg.sizeMin;
      applyOptions();
    });
    document.getElementById('numSizeMax').addEventListener('change',function(e){
      var v=parseFloat(e.target.value)||50;
      cfg.sizeMax=Math.max(v, cfg.sizeMin);
      e.target.value=cfg.sizeMax;
      applyOptions();
    });
    document.getElementById('rangeBorderWidth').addEventListener('input',function(e){
      cfg.borderWidth=parseFloat(e.target.value);
      document.getElementById('borderWidthVal').innerText=cfg.borderWidth;
      renderGraph();
    });
    document.getElementById('colorBorder').addEventListener('input',function(e){cfg.borderColor=e.target.value; renderGraph();});
  
    document.getElementById('selColorBy').addEventListener('change',function(e){
      cfg.colorBy=e.target.value;
      document.getElementById('gridUniform').classList.toggle('show', cfg.colorBy==='uniform');
      document.getElementById('gridGradient').classList.toggle('show', cfg.colorBy==='gradient');
      renderGraph();
    });
    document.getElementById('colorUniform').addEventListener('input',function(e){cfg.colorUniform=e.target.value; renderGraph();});
    document.getElementById('selGradMetric').addEventListener('change',function(e){cfg.colorGradMetric=e.target.value; renderGraph();});
    document.getElementById('colorGradLow').addEventListener('input',function(e){cfg.colorGradLow=e.target.value; renderGraph();});
    document.getElementById('colorGradHigh').addEventListener('input',function(e){cfg.colorGradHigh=e.target.value; renderGraph();});
  
    document.getElementById('chkLabelShow').addEventListener('change',function(e){cfg.labelShow=e.target.checked; renderGraph();});
    document.getElementById('rangeFontSize').addEventListener('input',function(e){
      cfg.fontSize=parseFloat(e.target.value);
      document.getElementById('fontSizeVal').innerText=cfg.fontSize;
      renderGraph();
    });
    document.getElementById('colorFont').addEventListener('input',function(e){cfg.fontColor=e.target.value; renderGraph();});
  
    document.getElementById('colorEdge').addEventListener('input',function(e){cfg.edgeColor=e.target.value; applyOptions();});
    document.getElementById('rangeEdgeOpacity').addEventListener('input',function(e){
      cfg.edgeOpacity=parseFloat(e.target.value);
      document.getElementById('edgeOpVal').innerText=cfg.edgeOpacity.toFixed(2);
      applyOptions();
    });
    document.getElementById('numEdgeMin').addEventListener('change',function(e){
      var v=parseFloat(e.target.value)||0.1;
      cfg.edgeWidthMin=Math.min(v, cfg.edgeWidthMax);
      e.target.value=cfg.edgeWidthMin;
      applyOptions();
    });
    document.getElementById('numEdgeMax').addEventListener('change',function(e){
      var v=parseFloat(e.target.value)||1;
      cfg.edgeWidthMax=Math.max(v, cfg.edgeWidthMin);
      e.target.value=cfg.edgeWidthMax;
      applyOptions();
    });
    document.getElementById('chkEdgeSmooth').addEventListener('change',function(e){cfg.edgeSmooth=e.target.checked; applyOptions();});
    document.getElementById('chkArrows').addEventListener('change',function(e){cfg.arrows=e.target.checked; applyOptions();});
  
    var restabilizeTimer=null;
    document.getElementById('chkPhysics').addEventListener('change',function(e){
      if(restabilizeTimer){clearTimeout(restabilizeTimer); restabilizeTimer=null;}
      cfg.physics=e.target.checked; applyOptions();
    });
    document.getElementById('selSolver').addEventListener('change',function(e){cfg.solver=e.target.value; applyOptions();});
    document.getElementById('rangeGravity').addEventListener('input',function(e){
      cfg.gravity=parseFloat(e.target.value);
      document.getElementById('gravityVal').innerText=cfg.gravity;
      applyOptions();
    });
    document.getElementById('rangeSpringLen').addEventListener('input',function(e){
      cfg.springLength=parseFloat(e.target.value);
      document.getElementById('springLenVal').innerText=cfg.springLength;
      applyOptions();
    });
    document.getElementById('rangeSpringConst').addEventListener('input',function(e){
      cfg.springConstant=parseFloat(e.target.value);
      document.getElementById('springConstVal').innerText=cfg.springConstant.toFixed(2);
      applyOptions();
    });
    document.getElementById('rangeDamping').addEventListener('input',function(e){
      cfg.damping=parseFloat(e.target.value);
      document.getElementById('dampingVal').innerText=cfg.damping.toFixed(2);
      applyOptions();
    });
    document.getElementById('btnRestabilize').addEventListener('click',function(){
      if(restabilizeTimer){clearTimeout(restabilizeTimer); restabilizeTimer=null;}
      var wasPhysics=cfg.physics;
      cfg.physics=true; applyOptions();
      net.stabilize(150);
      restabilizeTimer=setTimeout(function(){
        restabilizeTimer=null;
        if(!wasPhysics){cfg.physics=false; applyOptions(); document.getElementById('chkPhysics').checked=false;}
      },1600);
    });
  
    document.getElementById('chkZoomWheel').addEventListener('change',function(e){cfg.zoomWheel=e.target.checked; applyOptions();});
    document.getElementById('chkDragNodes').addEventListener('change',function(e){cfg.dragNodes=e.target.checked; applyOptions();});
    document.getElementById('btnFit').addEventListener('click',function(){net.fit({animation:true});});
    document.getElementById('colorBgCenter').addEventListener('input',function(e){cfg.bgCenter=e.target.value; applyBackground();});
    document.getElementById('colorBgEdge').addEventListener('input',function(e){cfg.bgEdge=e.target.value; applyBackground();});
  
    function updateZoomDisplay(){
        if(net) document.getElementById('zoomval').innerText=Math.round(net.getScale()*100)+'%';
    }
    function clampScale(s){ return Math.max(0.02, Math.min(20, s)); }
    document.getElementById('btnZoomIn').addEventListener('click',function(){net.moveTo({scale:clampScale(net.getScale()*1.2)}); });
    document.getElementById('btnZoomOut').addEventListener('click',function(){net.moveTo({scale:clampScale(net.getScale()/1.2)}); });
    document.getElementById('btnZoomReset').addEventListener('click',function(){net.fit({animation:true});});
    net.on('zoom', updateZoomDisplay);
  
    document.getElementById('btnTheme').addEventListener('click',function(){
      try{
        cfg.theme=cfg.theme==='light' ? 'dark' : 'light';
        document.body.classList.toggle('dark-theme', cfg.theme==='dark');
        if(cfg.theme==='dark'){
          cfg.bgCenter='#141a24'; cfg.bgEdge='#0c1017';
          cfg.fontColor='#e6e8ee'; cfg.borderColor='#0c1017'; cfg.edgeColor='#3a4a5f';
        }else{
          cfg.bgCenter='#ffffff'; cfg.bgEdge='#eef1f4';
          cfg.fontColor='#2c3e50'; cfg.borderColor='#ffffff'; cfg.edgeColor='#9fb0c4';
        }
        syncControlsFromCfg();
        applyBackground();
        applyOptions();
        renderGraph();
        // Force an immediate repaint instead of waiting on vis-network's own
        // debounce, so the color/background change is visible right away.
        if(net) requestAnimationFrame(function(){ net.redraw(); });
      }catch(err){
        console.error('테마 전환 실패:', err);
      }
    });
  
    var legend=document.getElementById('legend');
    // Build the legend from whatever community ids actually appear in the
    // node data, rather than trusting a separately-computed __NC__ count.
    // That count can drift (e.g. a community loses all its members once
    // edges are truncated to max_edges) and previously left this list empty
    // even though the summary header still said "N개".
    var communityIds=Object.keys(communityCounts).map(Number).sort(function(a,b){return a-b;});
    document.getElementById('commCount').innerText=communityIds.length;
    if(!communityIds.length){
      legend.innerHTML='<div class="empty">표시할 커뮤니티가 없습니다</div>';
    }
    communityIds.forEach(function(c){
      var d=document.createElement('div');d.className='legend-item';
      d.innerHTML='<span class="dot" style="background:'+palette[((c%palette.length)+palette.length)%palette.length]+'"></span>커뮤니티 '+c+
        '<span class="cnt">'+(communityCounts[c]||0)+'</span>';
      d.addEventListener('click',function(){
        var ids=rawNodes.filter(function(n){return n.group===c && currentVisibleIds[n.id];}).map(function(n){return n.id;});
        if(!ids.length)return;
        net.selectNodes(ids);net.fit({nodes:ids,animation:true});
      });
      legend.appendChild(d);
    });
  
    document.getElementById('btnExportPng').addEventListener('click',function(){
      var canvas=container.querySelector('canvas');
      if(!canvas){
        alert('내보낼 그래프 캔버스를 찾지 못했습니다. 그래프가 표시된 상태에서 다시 시도해주세요.');
        return;
      }
      try{
        canvas.toBlob(function(blob){
          if(!blob){
            alert('PNG 생성에 실패했습니다.');
            return;
          }
          var url=URL.createObjectURL(blob);
          var link=document.createElement('a');
          link.download='word_network.png';
          link.href=url;
          // Anchor must be attached to the DOM for click() to reliably trigger a
          // download in some browsers/sandboxed preview frames.
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          // Sandboxed iframes (no "allow-downloads") silently swallow the click
          // above, so also open the image in a new tab as a fallback the user
          // can right-click → "이미지를 다른 이름으로 저장" on.
          window.open(url, '_blank');
          setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
        }, 'image/png');
      }catch(err){
        console.error('PNG export failed:', err);
        alert('PNG 저장에 실패했습니다: '+err.message);
      }
    });
  
    document.getElementById('btnResetSettings').addEventListener('click',function(){
      try{
        cfg=Object.assign({}, defaultCfg);
        document.body.classList.remove('dark-theme');
        document.getElementById('search').value='';
        if(net) net.unselectAll();
        document.getElementById('detail').innerHTML='<div class="empty"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8b98a8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.4" fill="#8b98a8"/></svg><br>노드를 클릭하면<br>상세 지표가 표시됩니다</div>';
        syncControlsFromCfg();
        applyBackground();
        applyOptions();
        renderGraph();
        if(net){
          net.fit({animation:true});
          requestAnimationFrame(function(){ net.redraw(); });
        }
      }catch(err){
        console.error('설정 초기화 실패:', err);
      }
    });
  
    net.fit({animation:false});
    updateZoomDisplay();
    </script>
</body></html>
