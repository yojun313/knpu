<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Network Viewer</title>
<link rel="stylesheet" href="/css/upload.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="dot"></span>
      <span>KNPU Word Network Viewer</span>
    </div>
    <h1>네트워크 분석 결과 업로드</h1>
    <p class="sub">MANAGER의 <strong>단어 네트워크 분석</strong>이 만들어 준 결과 zip을
      그대로 올리면, 서버에서 그래프를 구성해 인터랙티브 뷰어로 바로 보여드립니다.</p>

    <label id="dropzone" for="fileInput">
      <input type="file" id="fileInput" accept=".zip" hidden>
      <div class="dz-icon">＋</div>
      <div class="dz-text">zip 파일을 여기로 끌어놓거나 클릭해서 선택하세요</div>
      <div class="dz-sub">nodes.csv / edges.csv 가 들어있는 결과 zip (network_*.zip)</div>
    </label>

    <div id="status" class="status"></div>

    <div id="networkList" class="network-list" hidden></div>

    <p class="help">
      결과 zip이 없다면 MANAGER 앱의 분석 탭에서 <strong>네트워크 분석</strong>을 먼저 실행해주세요.
      업로드된 데이터는 24시간 뒤 자동으로 삭제됩니다.
      자세한 사용법은 <a href="https://knpu.re.kr/manual/network" target="_blank">매뉴얼</a>을 참고하세요.
    </p>
  </div>
  <script src="/js/upload.js"></script>
</body>
</html>
