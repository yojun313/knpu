<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>PAILAB - GALLERY</title>
    <script
      src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/imgs/pailab_logo_favicon.ico"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700"
      rel="stylesheet"
      type="text/css"
    />
    <link href="css/styles.css" rel="stylesheet" />
    <style>
      /* 헤더 섹션 (기존 디자인 유지) */
      .masthead_team {
        position: relative;
        width: 100%;
        height: 50vh;
        min-height: 350px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000;
      }

      #bg-video {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        object-fit: cover;
        z-index: 1;
        opacity: 0.7; /* 갤러리 페이지는 텍스트 가독성을 위해 살짝 어둡게 */
      }

      .masthead_team .container {
        position: relative;
        z-index: 2;
        text-align: center;
        color: white;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* 갤러리 카드 스타일 */
      .photo-card {
        border: none;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 30px;
        background: #fff;
      }
      .photo-card:hover {
        transform: translateY(-10px);
      }
      .photo-img-container {
        width: 100%;
        height: 250px;
        overflow: hidden;
      }
      .photo-img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo-caption {
        padding: 1.5px;
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .photo-date {
        font-size: 0.85rem;
        color: #6c757d;
      }

      @media (max-width: 768px) {
        .masthead_team { height: 40vh; }
        .photo-img-container { height: 200px; }
      }
    </style>
  </head>

  <body id="page-top">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
      <div class="container">
        <a class="navbar-brand" href="/"
          ><img src="assets/imgs/pailab_logo.png" alt="..."
        /></a>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">RESEARCH</a></li>
            <li class="nav-item"><a class="nav-link" href="/publications">PUBLICATIONS</a></li>
            <li class="nav-item"><a class="nav-link" href="/#">NEWS</a></li>
            <li class="nav-item"><a class="nav-link" href="/team">OUR TEAM</a></li>
            <li class="nav-item"><a class="nav-link" href="/photos">PHOTOS</a></li>
            <li class="nav-item"><a class="nav-link" href="/systems">SYSTEM</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Masthead -->
    <header class="masthead_team">
      <video autoplay muted loop playsinline preload="auto" id="bg-video">
        <source src="assets/video/연구팀_소개영상.mp4" type="video/mp4" />
      </video>
      <div class="container">
        <div class="masthead_team-subheading">PAILAB</div>
        <div class="masthead_team-heading text-uppercase">GROUP PHOTOS</div>
      </div>
    </header>

    <section class="page-section bg-light" id="gallery">
      <div class="container">
        <div class="text-center">
          <h2 class="section-heading text-uppercase">Gallery</h2>
          <h3 class="section-subheading text-muted">PAILAB의 소중한 기록들입니다.</h3>
        </div>
        
        <!-- 사진들이 담길 컨테이너 -->
        <div class="row" id="gallery-container">
            <!-- JS로 데이터가 삽입됩니다 -->
        </div>
      </div>
    </section>

    <footer class="footer py-4">
      <div class="container text-center">Copyright &copy; KNPU PAILAB</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const video = document.getElementById("bg-video");
        if (video) video.play().catch(() => {});

        try {
          // 백엔드 단체사진 API 호출
          const response = await fetch("https://home.knpu.re.kr/api/group-photos/");
          const photos = await response.json();
          
          const container = document.getElementById("gallery-container");

          if (photos.length === 0) {
            container.innerHTML = `<div class="col-12 text-center text-muted"><p>등록된 사진이 없습니다.</p></div>`;
            return;
          }

          photos.forEach((p) => {
            // 날짜 포맷 변경 (ISO 형식인 경우 YYYY.MM.DD로 변환)
            const dateStr = p.date ? p.date.split('T')[0].replace(/-/g, '.') : '';

            const photoHtml = `
              <div class="col-lg-4 col-md-6 mb-4">
                <div class="card photo-card">
                  <div class="photo-img-container">
                    <img src="${p.url}" alt="${p.caption}" class="card-img-top">
                  </div>
                  <div class="card-body photo-caption text-center">
                    <h5 class="card-title fw-bold mb-1">${p.caption}</h5>
                    <p class="photo-date mb-0">${dateStr}</p>
                  </div>
                </div>
              </div>
            `;
            container.insertAdjacentHTML("beforeend", photoHtml);
          });
        } catch (error) {
          console.error("Gallery Load Error:", error);
          document.getElementById("gallery-container").innerHTML = 
            `<div class="col-12 text-center text-danger"><p>데이터를 불러오는 중 오류가 발생했습니다.</p></div>`;
        }
      });
    </script>
  </body>
</html>
