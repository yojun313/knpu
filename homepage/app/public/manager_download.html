<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANAGER Download</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #007bff;
      --dark: #1a1d20;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #333;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 20px;
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 50px;
    }

    .header-section h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .header-section h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #666;
    }

    .header-section a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* Latest Version Card (Now on Top) */
    .latest-version {
      background: linear-gradient(135deg, #ffffff 0%, #f1f7ff 100%);
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      border: 1px solid rgba(0, 123, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 123, 255, 0.05);
      margin-bottom: 50px; /* Spacing before image */
    }

    .latest-version h3 {
      font-size: 1.8rem;
      color: var(--dark);
      margin-bottom: 15px;
    }

    .info-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      color: #666;
      font-size: 0.95rem;
    }

    .info-item i { margin-right: 5px; color: var(--primary); }

    /* Buttons */
    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 35px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--dark);
      border-radius: 14px;
      text-decoration: none;
      transition: var(--transition);
    }

    .button:hover {
      background-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
    }

    .btn-secondary {
      padding: 8px 16px;
      font-size: 0.9rem;
      background-color: transparent;
      color: var(--dark);
      border: 1.5px solid #ddd;
      border-radius: 8px;
    }

    .btn-secondary:hover {
      border-color: var(--dark);
      background-color: transparent;
      transform: none;
      box-shadow: none;
    }

    /* Hero Image Section (Now Below Download) */
    .app-preview {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 40px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .app-preview img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Previous Versions Section */
    .toggle-button {
      display: block;
      width: fit-content;
      margin: 40px auto 20px;
      cursor: pointer;
      color: #888;
      font-weight: 600;
      transition: var(--transition);
    }

    .toggle-button:hover { color: var(--dark); }

    .history-container {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: #fcfcfc;
      padding: 18px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      border-bottom: 1px solid #eee;
    }

    td {
      padding: 20px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.95rem;
    }

    .hidden { display: none; }
    .center { text-align: center; }

    @media (max-width: 768px) {
      .header-section h1 { font-size: 2rem; }
      .info-group { flex-direction: column; gap: 5px; }
      .latest-version { padding: 30px 20px; }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="assets/img/pailab_logo_favicon.ico" />
  <script>
    function toggleTable() {
      const container = document.getElementById('historyContainer');
      const toggleButton = document.getElementById('toggleButton');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        toggleButton.innerHTML = '<i class="fas fa-chevron-up"></i> Hide Archive';
      } else {
        container.classList.add('hidden');
        toggleButton.innerHTML = '<i class="fas fa-chevron-down"></i> View Version History';
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch('/files');
        let files = await response.json();
        files = files.filter(file => !file.name.includes('_update.exe'));
        
        if (files.length === 0) {
          document.getElementById('latestVersion').innerHTML = '<p>No files available.</p>';
          return;
        }

        files.sort((a, b) => new Date(b.created) - new Date(a.created));
        const latestFile = files[0];

        // Update Latest Section
        document.getElementById('latestVersion').innerHTML = `
          <h3>${latestFile.name}</h3>
          <div class="info-group">
            <span class="info-item"><i class="fas fa-hdd"></i> ${latestFile.size}</span>
            <span class="info-item"><i class="fas fa-calendar-alt"></i> ${latestFile.created}</span>
          </div>
          <a href="/download/${latestFile.name}" class="button">
            <i class="fas fa-cloud-download-alt"></i> Download Latest
          </a>
        `;

        // Update History Table
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = '';
        files.slice(1).forEach(file => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="center" style="font-weight:600;">${file.name}</td>
            <td class="center" style="color:#888;">${file.size}</td>
            <td class="center" style="color:#888;">${file.created}</td>
            <td class="center">
              <a href="/download/${file.name}" class="btn-secondary">
                <i class="fas fa-download"></i>
              </a>
            </td>
          `;
          fileList.appendChild(row);
        });
      } catch (e) {
        console.error("Failed to load files", e);
      }
    }
  
    document.addEventListener('DOMContentLoaded', loadFiles);
  </script>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <h1>MANAGER</h1>
      <h2>Unified Research Management Platform</h2>
      <h2>Developed by <a href="https://github.com/yojun313" target="_blank">Yojun Moon</a></h2>
    </div>

    <!-- 1. Latest Version Hero (Now Primary) -->
    <div id="latestVersion" class="latest-version">
      <!-- Dynamic Content Loaded Here -->
    </div>

    <!-- 2. App Preview Image (Context/Verification Below) -->
    <div class="app-preview">
      <img src="assets/img/systems/manager.png" alt="Manager Application Preview">
    </div>
    
    <!-- 3. Toggle Archive -->
    <div id="toggleButton" class="toggle-button" onclick="toggleTable()">
      <i class="fas fa-chevron-down"></i> View Version History
    </div>

    <!-- 4. Archive Table -->
    <div id="historyContainer" class="history-container hidden">
      <table>
        <thead>
          <tr>
            <th class="center">Version</th>
            <th class="center">Size</th>
            <th class="center">Release Date</th>
            <th class="center">Download</th>
          </tr>
        </thead>
        <tbody id="fileList">
          <!-- Archive Content -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
