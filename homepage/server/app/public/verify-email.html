<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>이메일 인증 | FPEI</title>
  <script defer src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="assets/imgs/lab_logo_favicon.ico" />
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body {
      background-color: #eef1f5;
      min-height: 100vh;
    }

    .masthead_auth {
      position: relative;
      padding-top: 12.5rem;
      padding-bottom: 6rem;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #1a1d20 0%, #2c3e50 100%);
    }

    .masthead_auth-heading {
      font-family: "Montserrat", sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0;
    }

    .masthead_auth-subheading {
      font-size: 1.15rem;
      font-style: italic;
      margin-bottom: 20px;
    }

    .auth-card {
      max-width: 440px;
      margin: -4.5rem auto 5rem;
      border: none;
      border-top: 4px solid var(--bs-primary);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.14);
      background-color: #fff;
    }

    .auth-card .card-body {
      padding: 2.25rem 2rem;
    }

    .auth-card h2 {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }

    .auth-card .form-hint {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 1.5rem;
    }

    .auth-switch {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
    }

    .auth-alert {
      display: none;
    }

    .auth-success-state {
      display: none;
      text-align: center;
    }

    .auth-success-state i {
      font-size: 3rem;
      color: var(--bs-primary);
      margin-bottom: 1rem;
    }
  </style>
</head>

<body id="page-top" data-page="account">
  <div id="nav-placeholder"></div>

  <header class="masthead_auth">
    <div class="container">
      <div class="masthead_auth-subheading">KNPU FPEI</div>
      <div class="masthead_auth-heading">이메일 인증</div>
    </div>
  </header>

  <div class="container">
    <div class="card auth-card" id="verify-panel">
      <div class="card-body">
        <h2>인증번호 입력</h2>
        <div class="form-hint">
          가입하신 이메일로 전송된 6자리 인증번호를 입력해주세요.<br />
          메일이 안 보이면 <strong>스팸함(스팸 메일함)</strong>도 확인해주세요.
        </div>
        <div class="alert alert-danger auth-alert" id="verify-error"></div>

        <form id="verify-form">
          <div class="mb-3">
            <label class="form-label" for="ve-username">아이디</label>
            <input type="text" class="form-control" id="ve-username" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="ve-code">인증번호</label>
            <input type="text" class="form-control" id="ve-code" required maxlength="6" />
          </div>
          <button type="submit" class="btn btn-primary w-100">인증하기</button>
        </form>

        <div class="auth-switch">
          인증번호를 못 받으셨나요? <a href="#" id="resend-code">다시 받기</a>
        </div>
      </div>
    </div>

    <div class="card auth-card auth-success-state" id="success-panel">
      <div class="card-body">
        <i class="fa-solid fa-circle-check"></i>
        <h2>이메일 인증 완료</h2>
        <p class="form-hint">관리자 승인 후 로그인할 수 있습니다. 승인 결과는 이메일로 안내드립니다.</p>
        <a href="/login" class="btn btn-primary w-100">로그인 페이지로 이동</a>
      </div>
    </div>
  </div>

  <footer class="footer py-4">
    <div class="container text-center">Copyright &copy; KNPU FPEI</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const prefillUsername = params.get('username');
    if (prefillUsername) {
      document.getElementById('ve-username').value = prefillUsername;
    }

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('verify-error');
      errorEl.style.display = 'none';

      const username = document.getElementById('ve-username').value.trim();
      const code = document.getElementById('ve-code').value.trim();

      try {
        const res = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, code }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || '인증에 실패했습니다';
          errorEl.style.display = 'block';
          return;
        }
        document.getElementById('verify-panel').style.display = 'none';
        document.getElementById('success-panel').style.display = 'block';
      } catch (err) {
        errorEl.textContent = '서버와 통신할 수 없습니다';
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('resend-code').addEventListener('click', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('verify-error');
      errorEl.style.display = 'none';
      const username = document.getElementById('ve-username').value.trim();
      if (!username) {
        errorEl.textContent = '아이디를 먼저 입력해주세요';
        errorEl.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/auth/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || '재전송에 실패했습니다';
          errorEl.style.display = 'block';
          return;
        }
        alert('인증번호를 다시 전송했습니다');
      } catch (err) {
        errorEl.textContent = '서버와 통신할 수 없습니다';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>

</html>
