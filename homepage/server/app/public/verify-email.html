<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>이메일 인증 | FPEI</title>
  <script defer src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="assets/imgs/lab_logo_favicon.ico" />
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(180deg, #f4f5f7 0%, #eef1f5 100%);
      min-height: 100vh;
    }

    .auth-hero {
      padding-top: 8.5rem;
      padding-bottom: 3rem;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #1a1d20 0%, #2c3e50 100%);
    }

    .auth-hero .eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--bs-primary);
    }

    .auth-hero h1 {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.9rem;
      margin: 0.25rem 0 0;
    }

    .auth-shell {
      max-width: 420px;
      margin: -2rem auto 5rem;
    }

    .auth-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      background: #fff;
      overflow: hidden;
    }

    .auth-card-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--bs-primary), #ffdd66);
    }

    .auth-card-body {
      padding: 2rem 1.9rem;
    }

    .auth-card h2 {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auth-card h2 i {
      color: var(--bs-primary);
      font-size: 1rem;
    }

    .auth-hint {
      font-size: 0.83rem;
      color: #8b95a1;
      margin-bottom: 1.4rem;
      line-height: 1.5;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #495057;
    }

    .btn-auth-primary {
      background: #212529;
      border-color: #212529;
      font-family: "Montserrat", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 9px;
      padding: 0.6rem;
    }

    .btn-auth-primary:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .auth-switch {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: #6c757d;
    }

    .auth-switch a {
      font-weight: 600;
    }

    .auth-alert {
      display: none;
      font-size: 0.85rem;
      border-radius: 10px;
    }

    .auth-success-state {
      display: none;
      text-align: center;
    }

    .auth-success-state .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #eaf7ef;
      color: #1a8a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 1.1rem;
    }

    .auth-success-state.pending .success-icon {
      background: #fff6e0;
      color: #c98500;
    }
  </style>
</head>

<body id="page-top" data-page="account">
  <div id="nav-placeholder"></div>

  <header class="auth-hero">
    <div class="container">
      <div class="eyebrow">KNPU FPEI</div>
      <h1>이메일 인증</h1>
    </div>
  </header>

  <div class="container">
    <div class="auth-shell" id="pending-panel">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body">
          <h2><i class="fa-solid fa-envelope-circle-check"></i>메일함을 확인해주세요</h2>
          <div class="auth-hint">
            가입하신 이메일로 인증 링크를 보내드렸습니다.<br />
            메일에 있는 <strong>링크를 클릭</strong>하면 인증이 완료됩니다.<br />
            메일이 안 보이면 <strong>스팸함</strong>도 확인해주세요.
          </div>
          <div class="alert alert-danger auth-alert" id="verify-error"></div>

          <div class="mb-3">
            <label class="form-label" for="ve-username">아이디</label>
            <input type="text" class="form-control" id="ve-username" required />
          </div>

          <div class="auth-switch">
            링크를 못 받으셨나요? <a href="#" id="resend-code">다시 받기</a>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-shell" id="verifying-panel" style="display: none">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body text-center">
          <h2 class="justify-content-center">인증 처리 중입니다...</h2>
        </div>
      </div>
    </div>

    <div class="auth-shell auth-success-state" id="success-panel">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body">
          <div class="success-icon"><i class="fa-solid fa-check"></i></div>
          <h2 class="justify-content-center" id="success-title">이메일 인증 완료</h2>
          <p class="auth-hint" id="success-message">관리자 승인 후 로그인할 수 있습니다. 승인 결과는 이메일로 안내드립니다.</p>
          <a href="/login" class="btn btn-auth-primary w-100 text-white">로그인 페이지로 이동</a>
        </div>
      </div>
    </div>

    <div class="auth-shell auth-success-state pending" id="fail-panel">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body">
          <div class="success-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <h2 class="justify-content-center">인증에 실패했습니다</h2>
          <p class="auth-hint" id="fail-message">인증 링크가 유효하지 않거나 만료되었습니다.</p>
          <a href="/verify-email" class="btn btn-auth-primary w-100 text-white">다시 시도하기</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer py-4">
    <div class="container text-center">Copyright &copy; KNPU FPEI</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const prefillUsername = params.get('username');
    if (prefillUsername) {
      document.getElementById('ve-username').value = prefillUsername;
    }

    const token = params.get('token');

    function showFail(message) {
      document.getElementById('pending-panel').style.display = 'none';
      document.getElementById('verifying-panel').style.display = 'none';
      const failPanel = document.getElementById('fail-panel');
      document.getElementById('fail-message').textContent =
        message || '인증 링크가 유효하지 않거나 만료되었습니다.';
      failPanel.style.display = 'block';
    }

    function showSuccess(data) {
      document.getElementById('pending-panel').style.display = 'none';
      document.getElementById('verifying-panel').style.display = 'none';
      const successPanel = document.getElementById('success-panel');
      if (data.auto_approved) {
        document.getElementById('success-title').textContent = '가입이 완료되었습니다';
        document.getElementById('success-message').textContent =
          '기존 멤버 프로필과 자동으로 연결되어 별도 승인 없이 바로 로그인할 수 있습니다.';
      } else {
        successPanel.classList.add('pending');
        document.getElementById('success-title').textContent = '이메일 인증 완료';
        document.getElementById('success-message').textContent =
          data.message || '관리자 승인 후 로그인할 수 있습니다. 승인 결과는 이메일로 안내드립니다.';
      }
      successPanel.style.display = 'block';
    }

    if (token) {
      document.getElementById('pending-panel').style.display = 'none';
      document.getElementById('verifying-panel').style.display = 'block';

      fetch('/api/auth/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok) {
            showFail(data.detail);
            return;
          }
          showSuccess(data);
        })
        .catch(() => {
          showFail('서버와 통신할 수 없습니다');
        });
    }

    let resendLocked = false;

    document.getElementById('resend-code').addEventListener('click', async (e) => {
      e.preventDefault();
      if (resendLocked) return;

      const link = e.currentTarget;
      const errorEl = document.getElementById('verify-error');
      errorEl.style.display = 'none';
      const username = document.getElementById('ve-username').value.trim();
      if (!username) {
        errorEl.textContent = '아이디를 먼저 입력해주세요';
        errorEl.style.display = 'block';
        return;
      }

      // 연속 클릭으로 이메일이 여러 통 나가는 것을 막기 위해, 요청 중이거나
      // 방금 전송에 성공한 직후에는 잠깐 동안 다시 누를 수 없게 잠근다.
      resendLocked = true;
      const originalText = link.textContent;
      link.style.pointerEvents = 'none';
      link.style.opacity = '0.5';
      link.textContent = '전송 중...';

      try {
        const res = await fetch('/api/auth/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || '재전송에 실패했습니다';
          errorEl.style.display = 'block';
          return;
        }
        alert('인증 링크를 다시 전송했습니다');
        link.textContent = '전송 완료 (잠시 후 다시 가능)';
        setTimeout(() => {
          resendLocked = false;
          link.style.pointerEvents = '';
          link.style.opacity = '';
          link.textContent = originalText;
        }, 20000);
        return;
      } catch (err) {
        errorEl.textContent = '서버와 통신할 수 없습니다';
        errorEl.style.display = 'block';
      }

      // 실패한 경우엔 기다릴 이유가 없으니 바로 다시 시도할 수 있게 풀어준다.
      resendLocked = false;
      link.style.pointerEvents = '';
      link.style.opacity = '';
      link.textContent = originalText;
    });
  </script>
</body>

</html>
