<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Gallery | FPEI</title>
  <script defer src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="assets/imgs/lab_logo_favicon.ico" />
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    /* 상단 헤더 */
    #masthead-recent {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 400px;
      padding-top: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #222;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      box-sizing: border-box;
    }

    #masthead-recent::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    #masthead-recent .container {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
    }

    @media (max-width: 768px) {
      #masthead-recent {
        height: 40vh;
      }
    }

    /* 필터 바 */
    .gallery-filters {
      margin-bottom: 1.5rem;
    }

    .gallery-view-btn.active {
      pointer-events: none;
    }

    .gallery-date-chip {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background-color: #002d56;
      color: #fff;
      border-radius: 999px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
    }

    .gallery-date-chip.active {
      display: inline-flex;
    }

    .gallery-date-chip button {
      background: none;
      border: none;
      color: #fff;
      opacity: 0.8;
      padding: 0;
      line-height: 1;
      font-size: 0.9rem;
    }

    .gallery-date-chip button:hover {
      opacity: 1;
    }

    /* 크게보기 */
    .gallery-large-item {
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      cursor: pointer;
      overflow: hidden;
    }

    .gallery-large-img {
      width: 100%;
      height: 420px;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .gallery-large-img {
        height: 260px;
      }
    }

    .gallery-large-excerpt {
      color: #555;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 작게보기 */
    .photo-card {
      border: none;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      background: #fff;
      cursor: pointer;
      position: relative;
    }

    .photo-card:hover {
      transform: translateY(-10px);
    }

    .photo-img-container {
      width: 100%;
      height: 250px;
      overflow: hidden;
      position: relative;
    }

    .photo-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-compact-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    @media (max-width: 768px) {
      .photo-img-container {
        height: 200px;
      }
    }

    /* 전체보기 */
    .gallery-full-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.6rem 0.25rem;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer;
    }

    .gallery-full-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 0.3rem;
      flex-shrink: 0;
    }

    .gallery-full-title {
      font-weight: 700;
      margin-bottom: 0;
      overflow-wrap: break-word;
    }

    /* flex 항목의 기본 min-width:auto로 인해 제목이 길 경우
       가로 스크롤이 발생하는 것을 방지 */
    .gallery-full-item .flex-grow-1 {
      min-width: 0;
    }

    .gallery-full-date {
      color: #888;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* 게시글 상세 모달 */
    #postModal .modal-content {
      background-color: transparent;
      border: none;
    }

    #postModal .modal-body {
      padding: 0;
      position: relative;
    }

    #postCarousel img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #000;
    }

    .modal-caption-box {
      color: white;
      padding: 20px;
      font-family: "Montserrat", sans-serif;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 0 0 5px 5px;
      max-height: 30vh;
      overflow-y: auto;
    }

    .modal-caption-box .post-content {
      white-space: pre-line;
      font-size: 0.95rem;
      color: #eee;
    }

    /* 캘린더 팝업 */
    .gallery-cal-section-label {
      font-weight: 700;
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 0.5rem;
    }

    .gallery-cal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .gallery-cal-grid.day-grid {
      grid-template-columns: repeat(7, 1fr);
    }

    .gallery-cal-cell {
      text-align: center;
      padding: 0.6rem 0.2rem;
      border-radius: 0.35rem;
      font-size: 0.85rem;
      background: #f2f2f2;
      color: #bbb;
    }

    .gallery-cal-cell.weekday-label {
      background: none;
      color: #888;
      font-weight: 700;
      padding: 0.2rem;
    }

    .gallery-cal-cell.empty {
      background: none;
    }

    .gallery-cal-cell.enabled {
      background: #002d56;
      color: #fff;
      cursor: pointer;
    }

    .gallery-cal-cell.enabled:hover {
      background: #01417a;
    }

    .gallery-cal-cell.selected {
      background: #ffc800 !important;
      color: #1a1d20 !important;
      font-weight: 700;
    }

    .gallery-cal-count {
      display: block;
      font-size: 0.65rem;
      opacity: 0.85;
    }
  </style>
</head>

<body id="page-top" data-page="gallery">
  <div id="nav-placeholder"></div>
  <script src="js/nav.js"></script>

  <header id="masthead-recent">
    <div class="container">
      <div class="masthead_team-subheading" style="font-size: 1.2rem;">FPEI</div>
      <div class="masthead_team-heading text-uppercase" style="font-size: 2.5rem;">GROUP GALLERY</div>
    </div>
  </header>

  <section class="page-section bg-light" id="gallery">
    <div class="container">
      <div class="row gallery-filters align-items-end g-3">
        <div class="col-lg-4 col-md-6">
          <label class="form-label fw-bold small text-uppercase" for="gallery-search">Search</label>
          <div class="input-group">
            <select id="gallery-search-scope" class="form-select form-select-sm">
              <option value="all">제목+본문</option>
              <option value="title">제목</option>
              <option value="content">본문</option>
            </select>
            <input type="text" id="gallery-search" class="form-control" placeholder="검색어를 입력하세요…" />
          </div>
        </div>
        <div class="col-lg-4 col-md-6">
          <label class="form-label fw-bold small text-uppercase">보기 방식</label>
          <div class="d-flex flex-wrap gap-1" id="gallery-view-toggle">
            <button type="button" class="btn btn-primary btn-sm gallery-view-btn active" data-view="compact">작게보기</button>
            <button type="button" class="btn btn-outline-primary btn-sm gallery-view-btn" data-view="large">크게보기</button>
            <button type="button" class="btn btn-outline-primary btn-sm gallery-view-btn" data-view="full">전체보기</button>
          </div>
        </div>
        <div class="col-lg-4 col-md-12 d-flex align-items-center gap-2">
          <button type="button" class="btn btn-dark btn-sm" id="gallery-calendar-btn">
            <i class="fas fa-calendar-days me-1"></i>날짜로 찾기
          </button>
          <span class="gallery-date-chip" id="gallery-date-chip">
            <span id="gallery-date-chip-label"></span>
            <button type="button" id="gallery-date-chip-clear" aria-label="날짜 필터 해제">✕</button>
          </span>
        </div>
      </div>

      <p class="text-muted small mb-3" id="gallery-result-count"></p>

      <div id="gallery-container"></div>
    </div>
  </section>

  <!-- 게시글 상세 모달 -->
  <div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-body">
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
            data-bs-dismiss="modal" aria-label="Close" style="z-index: 10;"></button>
          <div id="postCarousel" class="carousel slide">
            <div class="carousel-indicators" id="postCarouselIndicators"></div>
            <div class="carousel-inner" id="postCarouselInner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#postCarousel" data-bs-slide="prev" id="postCarouselPrev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#postCarousel" data-bs-slide="next" id="postCarouselNext">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="modal-caption-box">
            <h4 class="mb-1" id="postModalTitle"></h4>
            <p class="mb-2 text-muted" id="postModalDate" style="color:#bbb !important;"></p>
            <p class="post-content mb-0" id="postModalContent"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 날짜 브라우징 캘린더 팝업 -->
  <div class="modal fade" id="calendarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">날짜로 찾기</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="gallery-calendar-body"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="gallery-calendar-reset">초기화</button>
          <button type="button" class="btn btn-dark" id="gallery-calendar-select" disabled>선택</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer py-4">
    <div class="container text-center">Copyright &copy; KNPU FPEI</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script>
    const DATA_URL = "/api/gallery/";
    const VIEW_STORAGE_KEY = "galleryViewMode";
    const WEEKDAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

    let allPosts = [];
    let state = {
      viewMode: localStorage.getItem(VIEW_STORAGE_KEY) || "compact",
      activeDate: null, // "YYYY" | "YYYY-MM" | "YYYY-MM-DD"
    };
    let calendarSelection = { year: null, month: null, day: null };
    let dateIndex = { years: new Set(), monthsByYear: new Map(), daysByYearMonth: new Map(), countByYearMonth: new Map() };

    function normalizePost(p) {
      return {
        ...p,
        title: p.title || p.caption || "(제목 없음)",
        content: p.content || "",
        photos: (p.photos && p.photos.length) ? p.photos : (p.url ? [p.url] : []),
      };
    }

    function parsePostDate(dateStr) {
      if (!dateStr) return null;
      const m = String(dateStr).match(/(\d{4})[.\-](\d{1,2})(?:[.\-](\d{1,2}))?/);
      if (!m) return null;
      return {
        year: m[1],
        month: m[2].padStart(2, "0"),
        day: m[3] ? m[3].padStart(2, "0") : null,
      };
    }

    // 정렬 전용 "YYYYMMDD" 키. new Date(string)로 직접 비교하면 trailing dot이
    // 붙은 날짜("2022.07.24.")가 Invalid Date가 되어 정렬 순서가 깨지는 문제가 있었음.
    function postDateSortKey(dateStr) {
      const d = parsePostDate(dateStr);
      return d ? `${d.year}${d.month}${d.day || "01"}` : "00000000";
    }

    function buildDateIndex(posts) {
      const idx = { years: new Set(), monthsByYear: new Map(), daysByYearMonth: new Map(), countByYearMonth: new Map() };
      posts.forEach((p) => {
        const d = parsePostDate(p.date);
        if (!d || !d.day) return;
        idx.years.add(d.year);
        if (!idx.monthsByYear.has(d.year)) idx.monthsByYear.set(d.year, new Set());
        idx.monthsByYear.get(d.year).add(d.month);

        const ymKey = `${d.year}-${d.month}`;
        if (!idx.daysByYearMonth.has(ymKey)) idx.daysByYearMonth.set(ymKey, new Set());
        idx.daysByYearMonth.get(ymKey).add(d.day);
        idx.countByYearMonth.set(ymKey, (idx.countByYearMonth.get(ymKey) || 0) + 1);
      });
      return idx;
    }

    function getFilters() {
      return {
        search: document.getElementById("gallery-search").value.trim().toLowerCase(),
        scope: document.getElementById("gallery-search-scope").value,
      };
    }

    function matchesActiveDateFilter(p) {
      if (!state.activeDate) return true;
      const d = parsePostDate(p.date);
      if (!d || !d.day) return false;
      const [fYear, fMonth, fDay] = state.activeDate.split("-");
      if (d.year !== fYear) return false;
      if (fMonth && d.month !== fMonth) return false;
      if (fDay && d.day !== fDay) return false;
      return true;
    }

    function applyFilters() {
      const { search, scope } = getFilters();

      let filtered = allPosts.filter((p) => {
        if (!matchesActiveDateFilter(p)) return false;
        if (search) {
          let haystack;
          if (scope === "title") haystack = p.title.toLowerCase();
          else if (scope === "content") haystack = p.content.toLowerCase();
          else haystack = `${p.title} ${p.content}`.toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => postDateSortKey(b.date).localeCompare(postDateSortKey(a.date)));

      renderList(filtered);
      document.getElementById("gallery-result-count").textContent = `${filtered.length}개의 게시글이 검색되었습니다.`;
      syncUrl();
    }

    function syncUrl() {
      const { search, scope } = getFilters();
      const params = new URLSearchParams();
      if (search) params.set("search", search);
      if (scope && scope !== "all") params.set("scope", scope);
      if (state.activeDate) params.set("date", state.activeDate);
      const qs = params.toString();
      const newUrl = window.location.pathname + (qs ? `?${qs}` : "");
      window.history.replaceState(null, "", newUrl);
    }

    function formatDateLabel(dateStr) {
      if (!dateStr) return "";
      const d = parsePostDate(dateStr);
      if (!d) return dateStr;
      return d.day ? `${d.year}.${d.month}.${d.day}` : `${d.year}.${d.month}`;
    }

    function renderList(posts) {
      currentModalPosts = posts;
      const container = document.getElementById("gallery-container");
      if (!posts.length) {
        container.innerHTML = `<div class="text-center text-muted py-5"><p>등록된 게시글이 없습니다.</p></div>`;
        return;
      }
      if (state.viewMode === "large") container.innerHTML = renderLargeList(posts);
      else if (state.viewMode === "full") container.innerHTML = renderFullList(posts);
      else container.innerHTML = renderCompactGrid(posts);
    }

    function renderLargeList(posts) {
      return posts.map((p, i) => `
        <div class="gallery-large-item" onclick="openPostModal(${i})" data-uid="${p.uid}">
          <img src="${p.photos[0] || ""}" class="gallery-large-img" alt="${p.title}">
          <div class="p-3">
            <h4 class="fw-bold mb-1">${p.title}</h4>
            <p class="mb-2" style="color:#6c757d; font-size:0.85rem;">${formatDateLabel(p.date)}</p>
            ${p.content ? `<p class="gallery-large-excerpt mb-0">${p.content}</p>` : ""}
          </div>
        </div>
      `).join("");
    }

    function renderCompactGrid(posts) {
      const cards = posts.map((p, i) => `
        <div class="col-lg-4 col-md-6 mb-4">
          <div class="card photo-card" onclick="openPostModal(${i})" data-uid="${p.uid}">
            <div class="photo-img-container">
              <img src="${p.photos[0] || ""}" alt="${p.title}" class="card-img-top">
              ${p.photos.length > 1 ? `<span class="gallery-compact-badge"><i class="fas fa-images me-1"></i>${p.photos.length}</span>` : ""}
            </div>
            <div class="card-body photo-caption text-center">
              <h5 class="card-title fw-bold mb-1">${p.title}</h5>
              <p class="photo-date mb-0" style="color: #6c757d; font-size: 0.85rem;">${formatDateLabel(p.date)}</p>
            </div>
          </div>
        </div>
      `).join("");
      return `<div class="row">${cards}</div>`;
    }

    function renderFullList(posts) {
      return posts.map((p, i) => `
        <div class="gallery-full-item" onclick="openPostModal(${i})" data-uid="${p.uid}">
          <img src="${p.photos[0] || ""}" class="gallery-full-thumb" alt="${p.title}">
          <div class="flex-grow-1">
            <p class="gallery-full-title mb-0">${p.title}</p>
          </div>
          <span class="gallery-full-date">${formatDateLabel(p.date)}</span>
        </div>
      `).join("");
    }

    let currentModalPosts = [];
    function openPostModal(index) {
      const post = currentModalPosts[index];
      if (!post) return;

      document.getElementById("postModalTitle").textContent = post.title;
      document.getElementById("postModalDate").textContent = formatDateLabel(post.date);
      document.getElementById("postModalContent").textContent = post.content;

      const carouselEl = document.getElementById("postCarousel");
      bootstrap.Carousel.getInstance(carouselEl)?.dispose();

      const inner = document.getElementById("postCarouselInner");
      const indicators = document.getElementById("postCarouselIndicators");
      inner.innerHTML = post.photos.map((url, i) => `
        <div class="carousel-item ${i === 0 ? "active" : ""}">
          <img src="${url}" alt="${post.title}">
        </div>
      `).join("");
      indicators.innerHTML = post.photos.length > 1
        ? post.photos.map((_, i) => `<button type="button" data-bs-target="#postCarousel" data-bs-slide-to="${i}" class="${i === 0 ? "active" : ""}"></button>`).join("")
        : "";

      const showControls = post.photos.length > 1;
      document.getElementById("postCarouselPrev").style.display = showControls ? "" : "none";
      document.getElementById("postCarouselNext").style.display = showControls ? "" : "none";

      new bootstrap.Modal(document.getElementById("postModal")).show();
    }

    // ── 날짜 브라우징 캘린더 (연 → 월 → 일 순으로 한 팝업 안에 이어서 표시) ──
    function openCalendarModal() {
      if (state.activeDate) {
        const [y, m, d] = state.activeDate.split("-");
        calendarSelection = { year: y || null, month: m || null, day: d || null };
      } else {
        calendarSelection = { year: null, month: null, day: null };
      }
      renderCalendarBody();
      new bootstrap.Modal(document.getElementById("calendarModal")).show();
    }

    function renderCalendarBody() {
      const years = [...dateIndex.years].sort();

      let html = `<p class="gallery-cal-section-label">연도 선택</p><div class="gallery-cal-grid">`;
      html += years.map((y) => `
        <div class="gallery-cal-cell enabled ${calendarSelection.year === y ? "selected" : ""}" onclick="selectCalendarYear('${y}')">${y}</div>
      `).join("");
      html += `</div>`;

      if (calendarSelection.year) {
        const monthsWithPosts = dateIndex.monthsByYear.get(calendarSelection.year) || new Set();
        html += `<p class="gallery-cal-section-label mt-3">월 선택</p><div class="gallery-cal-grid">`;
        for (let m = 1; m <= 12; m++) {
          const mm = String(m).padStart(2, "0");
          const enabled = monthsWithPosts.has(mm);
          const selected = calendarSelection.month === mm;
          const count = dateIndex.countByYearMonth.get(`${calendarSelection.year}-${mm}`) || 0;
          html += `
            <div class="gallery-cal-cell ${enabled ? "enabled" : ""} ${selected ? "selected" : ""}" ${enabled ? `onclick="selectCalendarMonth('${mm}')"` : ""}>
              ${m}월
              ${enabled ? `<span class="gallery-cal-count">${count}건</span>` : ""}
            </div>
          `;
        }
        html += `</div>`;
      }

      if (calendarSelection.year && calendarSelection.month) {
        const ymKey = `${calendarSelection.year}-${calendarSelection.month}`;
        const daysWithPosts = dateIndex.daysByYearMonth.get(ymKey) || new Set();
        const firstWeekday = new Date(Number(calendarSelection.year), Number(calendarSelection.month) - 1, 1).getDay();
        const totalDays = new Date(Number(calendarSelection.year), Number(calendarSelection.month), 0).getDate();

        html += `<p class="gallery-cal-section-label mt-3">일 선택 (선택하지 않으면 해당 월 전체)</p><div class="gallery-cal-grid day-grid">`;
        html += WEEKDAY_LABELS.map((w) => `<div class="gallery-cal-cell weekday-label">${w}</div>`).join("");
        for (let i = 0; i < firstWeekday; i++) {
          html += `<div class="gallery-cal-cell empty"></div>`;
        }
        for (let d = 1; d <= totalDays; d++) {
          const dd = String(d).padStart(2, "0");
          const enabled = daysWithPosts.has(dd);
          const selected = calendarSelection.day === dd;
          html += `
            <div class="gallery-cal-cell ${enabled ? "enabled" : ""} ${selected ? "selected" : ""}" ${enabled ? `onclick="selectCalendarDay('${dd}')"` : ""}>
              ${d}
            </div>
          `;
        }
        html += `</div>`;
      }

      document.getElementById("gallery-calendar-body").innerHTML = html;
      document.getElementById("gallery-calendar-select").disabled = !calendarSelection.year;
    }

    function selectCalendarYear(year) {
      calendarSelection = { year, month: null, day: null };
      renderCalendarBody();
    }

    function selectCalendarMonth(month) {
      calendarSelection.month = calendarSelection.month === month ? null : month;
      calendarSelection.day = null;
      renderCalendarBody();
    }

    function selectCalendarDay(day) {
      calendarSelection.day = calendarSelection.day === day ? null : day;
      renderCalendarBody();
    }

    function resetCalendarSelection() {
      calendarSelection = { year: null, month: null, day: null };
      renderCalendarBody();
    }

    function confirmCalendarSelection() {
      if (!calendarSelection.year) return;
      let filter = calendarSelection.year;
      if (calendarSelection.month) {
        filter += `-${calendarSelection.month}`;
        if (calendarSelection.day) filter += `-${calendarSelection.day}`;
      }
      state.activeDate = filter;
      updateDateChip();
      bootstrap.Modal.getInstance(document.getElementById("calendarModal"))?.hide();
      applyFilters();
    }

    function clearDateFilter() {
      state.activeDate = null;
      updateDateChip();
      applyFilters();
    }

    function formatFilterLabel(filterStr) {
      const parts = filterStr.split("-");
      if (parts.length === 1) return `${parts[0]}년`;
      if (parts.length === 2) return `${parts[0]}.${parts[1]}`;
      return `${parts[0]}.${parts[1]}.${parts[2]}`;
    }

    function updateDateChip() {
      const chip = document.getElementById("gallery-date-chip");
      const label = document.getElementById("gallery-date-chip-label");
      if (state.activeDate) {
        chip.classList.add("active");
        label.textContent = formatFilterLabel(state.activeDate);
      } else {
        chip.classList.remove("active");
      }
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      localStorage.setItem(VIEW_STORAGE_KEY, mode);
      document.querySelectorAll(".gallery-view-btn").forEach((b) => {
        const active = b.dataset.view === mode;
        b.classList.toggle("active", active);
        b.classList.toggle("btn-primary", active);
        b.classList.toggle("btn-outline-primary", !active);
      });
      applyFilters();
    }

    function wireEvents() {
      document.getElementById("gallery-search").addEventListener("input", applyFilters);
      document.getElementById("gallery-search-scope").addEventListener("change", applyFilters);
      document.getElementById("gallery-calendar-btn").addEventListener("click", openCalendarModal);
      document.getElementById("gallery-date-chip-clear").addEventListener("click", clearDateFilter);
      document.getElementById("gallery-calendar-reset").addEventListener("click", resetCalendarSelection);
      document.getElementById("gallery-calendar-select").addEventListener("click", confirmCalendarSelection);
      document.getElementById("gallery-view-toggle").addEventListener("click", (e) => {
        const btn = e.target.closest(".gallery-view-btn");
        if (btn) setViewMode(btn.dataset.view);
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch(DATA_URL);
        const rawPosts = await response.json();

        if (!rawPosts || rawPosts.length === 0) {
          document.getElementById("gallery-container").innerHTML =
            `<div class="text-center text-muted py-5"><p>등록된 게시글이 없습니다.</p></div>`;
          return;
        }

        allPosts = rawPosts.map(normalizePost);
        allPosts.sort((a, b) => postDateSortKey(b.date).localeCompare(postDateSortKey(a.date)));
        dateIndex = buildDateIndex(allPosts);

        const masthead = document.getElementById("masthead-recent");
        if (allPosts[0].photos[0]) {
          masthead.style.backgroundImage = `url('${allPosts[0].photos[0]}')`;
        }

        document.querySelectorAll(".gallery-view-btn").forEach((b) => {
          const active = b.dataset.view === state.viewMode;
          b.classList.toggle("active", active);
          b.classList.toggle("btn-primary", active);
          b.classList.toggle("btn-outline-primary", !active);
        });

        wireEvents();

        const params = new URLSearchParams(window.location.search);
        const searchParam = params.get("search");
        const scopeParam = params.get("scope");
        const dateParam = params.get("date");
        if (searchParam) document.getElementById("gallery-search").value = searchParam;
        if (scopeParam) document.getElementById("gallery-search-scope").value = scopeParam;
        if (dateParam) {
          state.activeDate = dateParam;
          updateDateChip();
        }

        applyFilters();
      } catch (error) {
        console.error("Error:", error);
      }
    });
  </script>
</body>

</html>
