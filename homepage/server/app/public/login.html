<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>로그인 | FPEI</title>
  <script defer src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="assets/imgs/lab_logo_favicon.ico" />
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(180deg, #f4f5f7 0%, #eef1f5 100%);
      min-height: 100vh;
    }

    .auth-hero {
      padding-top: 8.5rem;
      padding-bottom: 3rem;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #1a1d20 0%, #2c3e50 100%);
    }

    .auth-hero .eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--bs-primary);
    }

    .auth-hero h1 {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.9rem;
      margin: 0.25rem 0 0;
    }

    .auth-shell {
      max-width: 420px;
      margin: -2rem auto 5rem;
    }

    .auth-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      background: #fff;
      overflow: hidden;
    }

    .auth-card-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--bs-primary), #ffdd66);
    }

    .auth-card-body {
      padding: 2rem 1.9rem;
    }

    .auth-card h2 {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auth-card h2 i {
      color: var(--bs-primary);
      font-size: 1rem;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #495057;
    }

    .input-icon-group {
      position: relative;
    }

    .input-icon-group i {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #adb5bd;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .input-icon-group input {
      padding-left: 2.2rem;
    }

    .btn-auth-primary {
      background: #212529;
      border-color: #212529;
      font-family: "Montserrat", sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 9px;
      padding: 0.6rem;
    }

    .btn-auth-primary:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .auth-switch {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.85rem;
      color: #6c757d;
    }

    .auth-switch a {
      font-weight: 600;
    }

    .auth-alert {
      display: none;
      font-size: 0.85rem;
      border-radius: 10px;
    }
  </style>
</head>

<body id="page-top" data-page="account">
  <div id="nav-placeholder"></div>

  <header class="auth-hero">
    <div class="container">
      <div class="eyebrow">KNPU FPEI</div>
      <h1>로그인</h1>
    </div>
  </header>

  <div class="container">
    <div class="auth-shell" id="login-panel">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body">
          <h2><i class="fa-solid fa-right-to-bracket"></i>계정 로그인</h2>
          <div class="alert alert-danger auth-alert" id="login-error"></div>
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label" for="login-username">아이디</label>
              <div class="input-icon-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" class="form-control" id="login-username" required autocomplete="username" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">비밀번호</label>
              <div class="input-icon-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="form-control" id="login-password" required
                  autocomplete="current-password" />
              </div>
            </div>
            <button type="submit" class="btn btn-auth-primary w-100 text-white">로그인</button>
          </form>
          <div class="auth-switch">
            <a href="#" id="show-forgot">비밀번호를 잊으셨나요?</a>
            <br />
            아직 계정이 없으신가요? <a href="/signup">회원가입</a>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-shell" id="forgot-panel" style="display:none;">
      <div class="card auth-card">
        <div class="auth-card-accent"></div>
        <div class="auth-card-body">
          <h2><i class="fa-solid fa-key"></i>비밀번호 재설정</h2>
          <div class="alert alert-danger auth-alert" id="forgot-error"></div>
          <div class="alert alert-success auth-alert" id="forgot-success"></div>

          <form id="forgot-request-form">
            <div class="mb-3">
              <label class="form-label" for="forgot-username">아이디</label>
              <div class="input-icon-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" class="form-control" id="forgot-username" required />
              </div>
            </div>
            <button type="submit" class="btn btn-outline-dark w-100">인증번호 받기</button>
          </form>

          <form id="forgot-reset-form" class="mt-3" style="display:none;">
            <div class="mb-3">
              <label class="form-label" for="reset-code">인증번호</label>
              <input type="text" class="form-control" id="reset-code" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="reset-password">새 비밀번호</label>
              <input type="password" class="form-control" id="reset-password" required minlength="8" />
            </div>
            <button type="submit" class="btn btn-auth-primary w-100 text-white">비밀번호 재설정</button>
          </form>

          <div class="auth-switch">
            <a href="#" id="show-login">로그인으로 돌아가기</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer py-4">
    <div class="container text-center">Copyright &copy; KNPU FPEI</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script src="js/nav.js"></script>
  <script>
    function safeRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (!redirect) return '/account';
      try {
        const url = new URL(redirect, window.location.origin);
        if (url.hostname === 'knpu.re.kr' || url.hostname.endsWith('.knpu.re.kr')) {
          return url.toString();
        }
      } catch (e) {
        /* fallthrough */
      }
      return '/account';
    }

    function showAlert(el, message) {
      el.textContent = message;
      el.style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(errorEl, data.detail || '로그인에 실패했습니다');
          return;
        }
        window.location.href = safeRedirectTarget();
      } catch (err) {
        showAlert(errorEl, '서버와 통신할 수 없습니다');
      }
    });

    document.getElementById('show-forgot').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('login-panel').style.display = 'none';
      document.getElementById('forgot-panel').style.display = 'block';
    });
    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgot-panel').style.display = 'none';
      document.getElementById('login-panel').style.display = 'block';
    });

    document.getElementById('forgot-request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const username = document.getElementById('forgot-username').value.trim();
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(errorEl, data.detail || '요청에 실패했습니다');
          return;
        }
        showAlert(successEl, data.message);
        document.getElementById('forgot-reset-form').style.display = 'block';
      } catch (err) {
        showAlert(errorEl, '서버와 통신할 수 없습니다');
      }
    });

    document.getElementById('forgot-reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      errorEl.style.display = 'none';

      const username = document.getElementById('forgot-username').value.trim();
      const code = document.getElementById('reset-code').value.trim();
      const new_password = document.getElementById('reset-password').value;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, code, new_password }),
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(errorEl, data.detail || '재설정에 실패했습니다');
          return;
        }
        showAlert(successEl, '비밀번호가 재설정되었습니다. 로그인해주세요.');
        setTimeout(() => {
          document.getElementById('forgot-panel').style.display = 'none';
          document.getElementById('login-panel').style.display = 'block';
        }, 1500);
      } catch (err) {
        showAlert(errorEl, '서버와 통신할 수 없습니다');
      }
    });
  </script>
</body>

</html>
