[project]
name = "knpu"
version = "0.1.0"
description = "Research System for PAILAB @ Korea National Police University"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aiosmtplib>=5.1.0",
    "asyncio>=4.0.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.14.3",
    "chardet>=7.4.3",
    "cryptography>=48.0.0",
    "discord-py>=2.7.1",
    "fastapi>=0.136.1",
    "faster-whisper>=1.2.1",
    "fastparquet>=2026.3.0",
    "flagembedding>=1.4.0",
    "google-api-python-client>=2.195.0",
    "google-auth-oauthlib>=1.3.1",
    "googletrans>=4.0.2",
    "jinja2>=3.1.6",
    "kiwipiepy>=0.23.1",
    "lxml>=6.1.0",
    "matplotlib>=3.10.9",
    "motor>=3.7.1",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "openai>=2.34.0",
    "opencv-python>=4.13.0.92",
    "packaging>=26.2",
    "pandas>=3.0.2",
    "paramiko<3.0.0",
    "pillow>=12.2.0",
    "protobuf>=7.34.1",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "pyinstaller>=6.20.0",
    "pyjwt>=2.12.1",
    "pymongo>=4.17.0",
    "pymysql>=1.1.3",
    "pyqtwebengine>=5.15.7",
    "pyside6>=6.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pytz>=2026.2",
    "requests>=2.33.1",
    "requests-toolbelt>=1.0.0",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "sshtunnel>=0.4.0",
    "starlette>=1.0.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
    "ultralytics>=8.4.52",
    "user-agent>=0.1.14",
    "uvicorn>=0.46.0",
    "websockets>=16.0",
    "wordcloud>=1.9.6",
    "yt-dlp>=2026.3.17",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = [
    "manager/app",
    "homepage",
    "crawler",
    "complaint",
    "bot",
    "admin",
]
