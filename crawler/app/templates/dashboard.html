<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAWLER</title>
    <link rel="icon" type="image/x-icon" href="static/fpei_logo_favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:    #0B1226;
            --blue:    #416BBF;
            --deep:    #2D4473;
            --sky:     #05AFF2;
            --mist:    #9AC7D9;

            --bg:      #f0f4f8;
            --surface: #ffffff;
            --ink:     #0B1226;
            --muted:   #4a5a72;
            --line:    #c8d6e5;

            --ok:       #166534;
            --ok-soft:  #dcfce7;
            --danger:   #b42318;
            --danger-soft: #fde4e2;
            --warning:  #9a3412;
            --warning-soft: #ffedd5;
            --queued-soft: #dbeafe;

            --shadow:  0 8px 24px rgba(11, 18, 38, 0.10);
            --shadow-sm: 0 2px 8px rgba(11, 18, 38, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif;
            font-weight: 700;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ── Header ──────────────────────────────────── */
        .header {
            background: linear-gradient(110deg, var(--navy) 0%, var(--deep) 60%, var(--blue) 100%);
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 2px 12px rgba(11,18,38,0.30);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            height: 34px;
            object-fit: contain;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .conn-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--mist);
            white-space: nowrap;
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .connected    { background: #4ade80; box-shadow: 0 0 6px #4ade8088; }
        .disconnected { background: #ef4444; }

        .logout-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.22);
            color: var(--mist);
            padding: 5px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            white-space: nowrap;
            transition: border-color 150ms, color 150ms;
        }
        .logout-btn:hover { border-color: #fff; color: #fff; }

        /* ── Layout ───────────────────────────────────── */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 22px 20px;
            display: grid;
            gap: 16px;
        }

        /* ── Panel ────────────────────────────────────── */
        .panel {
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .panel-head {
            padding: 12px 18px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            background: linear-gradient(180deg, #f8fafd 0%, #f0f5fb 100%);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--deep);
            letter-spacing: 0.2px;
        }

        .panel-count {
            font-size: 11px;
            color: var(--blue);
            background: #e8eef8;
            padding: 2px 9px;
            border-radius: 999px;
            font-weight: 700;
            white-space: nowrap;
        }

        .panel-body { padding: 14px; }

        /* ── Control Form ─────────────────────────────── */
        .requester-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: linear-gradient(90deg, #eef3fc, #f4f8ff);
            border: 1px solid #c8d6e5;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .r-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--blue);
            font-weight: 700;
        }
        .r-sep { color: var(--line); }
        .r-val {
            font-size: 14px;
            font-weight: 800;
            color: var(--navy);
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-row + .form-row { margin-top: 10px; }

        .f-crawler  { width: 148px; flex-shrink: 0; }
        .f-option   { width: 172px; flex-shrink: 0; }
        .f-priority { width: 82px;  flex-shrink: 0; }
        .f-speed    { width: 82px;  flex-shrink: 0; }

        .date-pair {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }
        .date-pair .field input { width: 116px; }
        .date-sep {
            padding-bottom: 10px;
            color: var(--blue);
            font-weight: 800;
            font-size: 15px;
            flex-shrink: 0;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .field label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--blue);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .field input, .field select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 13px;
            background: #fff;
            color: var(--ink);
            font-family: inherit;
            font-weight: 700;
            transition: border-color 150ms, box-shadow 150ms;
        }
        .field input:focus, .field select:focus {
            outline: none;
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(5, 175, 242, 0.15);
        }

        .status-box {
            margin-top: 10px;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            display: none;
            border: 1px solid transparent;
        }
        .status-ok  { display: block; background: var(--ok-soft);      color: var(--ok);      border-color: #86efac; }
        .status-err { display: block; background: var(--danger-soft);   color: var(--danger);  border-color: #fda29b; }

        /* ── Keyword section ─────────────────────────── */
        .keyword-section {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .keyword-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        .keyword-row > .field { flex: 1; margin: 0; }

        .op-btns {
            display: none;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }
        .op-btns.visible { display: flex; }

        .op-btn {
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: #f8fafd;
            color: var(--deep);
            font-size: 13px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: background 150ms, border-color 150ms;
            white-space: nowrap;
        }
        .op-btn:hover { background: #e8eef8; border-color: var(--blue); }

        /* ── Search op rows ──────────────────────────── */
        #search-ops {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        .search-op-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-op-tag {
            font-size: 12px;
            font-weight: 800;
            padding: 0 8px;
            height: 34px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            background: #e8eef8;
            color: var(--deep);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 36px;
            justify-content: center;
        }

        .search-op-input {
            flex: 1;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 700;
            color: var(--ink);
            background: #fff;
            transition: border-color 150ms, box-shadow 150ms;
        }
        .search-op-input:focus {
            outline: none;
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(5,175,242,0.15);
        }

        .search-op-del {
            height: 34px;
            padding: 0 10px;
            border: 1px solid #fda29b;
            border-radius: 6px;
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 13px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            flex-shrink: 0;
            transition: filter 150ms;
        }
        .search-op-del:hover { filter: brightness(0.93); }

        /* ── Cards ────────────────────────────────────── */
        .cards { display: grid; gap: 10px; }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
            border-color: var(--mist);
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card-left  { flex: 1; min-width: 0; }
        .card-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .job-keyword {
            font-size: 16px;
            font-weight: 800;
            color: var(--navy);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .job-meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px 10px;
        }
        .job-meta span { white-space: nowrap; }

        .progress-wrap { display: flex; align-items: center; gap: 8px; }
        .progress-bar  { width: 150px; height: 6px; background: #e2ecf5; border-radius: 999px; overflow: hidden; flex-shrink: 0; }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--sky));
            border-radius: 999px;
            transition: width 0.5s;
        }
        .progress-text { font-size: 13px; color: var(--deep); min-width: 40px; text-align: right; font-weight: 800; }

        .stats { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 2px 10px; }

        /* ── Card detail ──────────────────────────────── */
        .card-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 280ms ease, padding-top 280ms ease, margin-top 280ms ease, border-top-color 280ms ease;
            border-top: 1px solid transparent;
            margin-top: 0;
            padding-top: 0;
        }
        .card-detail.open {
            max-height: 600px;
            overflow-y: auto;
            border-top-color: var(--line);
            margin-top: 12px;
            padding-top: 12px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px 16px;
        }

        .detail-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--blue);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .detail-val {
            display: block;
            font-size: 13px;
            color: var(--ink);
            word-break: break-all;
            font-weight: 700;
        }

        .detail-val.mono {
            font-size: 11px;
            letter-spacing: 0.3px;
            color: var(--muted);
        }

        .detail-error-msg {
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #fda29b;
            word-break: break-word;
        }

        .btn-logs {
            margin-top: 10px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-logs:hover { background: var(--bg); }

        .job-logs {
            display: none;
            margin-top: 8px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fbfcfe;
        }
        .job-logs.open { display: block; }

        .job-logs-loading {
            padding: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .job-log-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 5px 9px;
            font-size: 11px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            border-bottom: 1px solid #eef1f6;
        }
        .job-log-row:last-child { border-bottom: none; }
        .job-log-time { color: var(--muted); flex-shrink: 0; white-space: nowrap; }
        .job-log-type {
            flex-shrink: 0;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            background: #edf1f7;
            color: var(--muted);
        }
        .job-log-error .job-log-type { background: var(--danger-soft); color: var(--danger); }
        .job-log-start .job-log-type,
        .job-log-end   .job-log-type { background: var(--ok-soft); color: var(--ok); }
        .job-log-error .job-log-msg { color: var(--danger); }
        .job-log-msg { word-break: break-word; min-width: 0; flex: 1; }

        /* ── Buttons ──────────────────────────────────── */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            transition: transform 150ms ease, filter 150ms ease;
            white-space: nowrap;
        }
        .btn:hover { filter: brightness(0.93); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: linear-gradient(125deg, var(--deep), var(--blue));
            color: #fff;
            box-shadow: 0 2px 8px rgba(65,107,191,0.30);
        }
        .btn-ghost {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--deep);
        }
        .btn-stop   { background: var(--danger-soft); color: var(--danger); }
        .btn-delete { background: #edf1f7; color: var(--muted); }
        .btn-resume { background: var(--ok-soft); color: var(--ok); }
        .btn-download { background: var(--queued-soft); color: var(--deep); }
        .btn-db-delete { background: var(--danger-soft); color: var(--danger); }

        /* ── Badges ───────────────────────────────────── */
        .state-badge { font-size: 11px; padding: 3px 9px; border-radius: 4px; font-weight: 700; white-space: nowrap; }
        .state-completed { background: var(--ok-soft);      color: var(--ok); }
        .state-error     { background: var(--danger-soft);   color: var(--danger); }
        .state-stopped   { background: var(--warning-soft);  color: var(--warning); }
        .state-queued    { background: var(--queued-soft);   color: var(--deep); }
        .state-running   { background: var(--queued-soft);   color: var(--deep); }

        /* ── Empty ────────────────────────────────────── */
        .empty {
            color: var(--muted);
            font-size: 13px;
            padding: 20px;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 10px;
            background: #f8fafd;
        }

        /* ── Database 목록 ─────────────────────────────── */
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input {
            border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
            font-family: inherit; font-weight: 700; font-size: 12px; color: var(--ink);
            min-width: 0;
        }
        .filter-bar input[type="text"] { flex: 1; min-width: 160px; }

        .db-table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead th {
            text-align: left; padding: 9px 10px; color: var(--muted); font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        tbody td { padding: 9px 10px; border-bottom: 1px solid #eef2f8; vertical-align: middle; }
        tbody tr:hover { background: #f8fafd; cursor: pointer; }
        tbody tr:last-child td { border-bottom: none; }
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

        .keyword-cell { font-weight: 800; color: var(--navy); word-break: break-word; }
        .muted-cell { color: var(--muted); font-size: 11px; }

        .pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; flex-wrap: wrap; }
        .pager button {
            border: 1px solid var(--line); background: #fff; color: var(--deep);
            padding: 5px 12px; border-radius: 6px; font-family: inherit; font-weight: 700;
            font-size: 12px; cursor: pointer;
        }
        .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pager span { font-size: 12px; color: var(--muted); white-space: nowrap; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(11,18,38,0.55);
            align-items: center; justify-content: center; z-index: 200; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff; border-radius: 14px; max-width: 640px; width: 100%;
            max-height: 84vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(11,18,38,0.35);
        }
        .modal-head {
            padding: 16px 20px; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .modal-head h3 { font-size: 15px; color: var(--navy); word-break: break-word; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); line-height: 1; flex-shrink: 0; }
        .modal-body { padding: 18px 20px; }

        .log-box { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
        .log-row {
            display: flex; gap: 8px; align-items: baseline; padding: 5px 9px; font-size: 11px;
            font-family: Consolas, monospace; border-bottom: 1px solid #eef1f6;
        }
        .log-row:last-child { border-bottom: none; }
        .log-time { color: var(--muted); flex-shrink: 0; white-space: nowrap; }
        .log-type { flex-shrink: 0; font-weight: 700; text-transform: uppercase; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #edf1f7; color: var(--muted); }
        .log-error .log-type { background: var(--danger-soft); color: var(--danger); }
        .log-error .log-msg { color: var(--danger); }
        .log-msg { word-break: break-word; min-width: 0; flex: 1; }

        .form-field { margin-bottom: 14px; }
        .form-field label { display: block; font-size: 12px; font-weight: 700; color: var(--deep); margin-bottom: 5px; }
        .form-field input[type="text"] {
            width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
            font-family: inherit; font-size: 13px; color: var(--ink);
        }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 960px) {
            .f-crawler { width: 130px; }
            .f-option  { width: 150px; }
            .progress-bar { width: 110px; }
        }

        @media (max-width: 640px) {
            .container { padding: 14px 12px; }
            .header { padding: 0 14px; height: 52px; }
            .header-logo { height: 28px; }
            .f-crawler  { flex: 1; width: auto; }
            .f-option   { flex: 1; width: auto; }
            .keyword-section { flex-basis: 100%; }
            .date-pair  { flex: 1 0 100%; }
            .date-pair .field { flex: 1; }
            .date-pair .field input { width: 100%; }
            .f-priority { flex: 1; width: auto; }
            .f-speed    { flex: 1; width: auto; }
            .form-actions { margin-left: 0; width: 100%; }
            .form-actions .btn { flex: 1; }
            .card-main { flex-wrap: wrap; }
            .card-right { width: 100%; justify-content: flex-end; }
            .progress-wrap { flex: 1; }
            .progress-bar { flex: 1; width: auto; }
            .job-log-row { flex-wrap: wrap; }
            .job-log-msg { flex-basis: 100%; }

            .conn-badge span:last-child { display: none; }

            /* Database 목록: 테이블 → 카드 형태로 전환 (글자 겹침/가로 스크롤 방지) */
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tbody tr { border-bottom: 1px solid var(--line); padding: 10px 6px; }
            tbody tr:hover { background: none; }
            tbody td { border: none; padding: 4px 6px; word-break: break-word; }
            tbody td:before { content: attr(data-label); font-size: 9px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 1px; }

            .modal-box { max-height: 92vh; }
            .modal-body { padding: 14px; }
            .log-row { flex-wrap: wrap; }
            .log-msg { flex-basis: 100%; }
            .actions-cell .btn { flex: 1 1 auto; text-align: center; }
        }

        @media (max-width: 420px) {
            .f-crawler, .f-option { flex-basis: 100%; }
            .header-right { gap: 8px; }
            .panel-title { font-size: 13px; }
        }
    </style>
</head>
<body data-is-admin="{{ 'true' if is_admin else 'false' }}" data-my-uid="{{ my_uid or '' }}">

<div class="header">
    <img src="/static/logo_white.png" alt="FPEI" class="header-logo">
    <div class="header-right">
        <span class="conn-badge">
            <span class="status-dot disconnected" id="conn-dot"></span>
            <span id="conn-text">연결 중...</span>
        </span>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
</div>

<div class="container">

    <!-- ── Control Panel ── -->
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">CRAWLER Control</div>
            <div class="panel-count">새 작업 추가</div>
        </div>
        <div class="panel-body">
            <form id="create-form" onsubmit="submitJob(event)">
                <div class="requester-bar">
                    <span class="r-label">요청자</span>
                    <span class="r-sep">|</span>
                    <span class="r-val" id="f-name"></span>
                </div>

                <!-- Row 1: 크롤러 + 옵션 -->
                <div class="form-row">
                    <div class="field f-crawler">
                        <label>크롤러</label>
                        <select id="f-object" required onchange="updateOptions()">
                            <option value="1">Naver News</option>
                            <option value="2">Naver Blog</option>
                            <option value="3">Naver Cafe</option>
                            <option value="4">YouTube</option>
                            <option value="5">ChinaDaily</option>
                            <option value="6">ChinaSina</option>
                        </select>
                    </div>
                    <div class="field f-option">
                        <label>옵션</label>
                        <select id="f-option" required></select>
                    </div>
                </div>

                <!-- Row 2: 키워드 + 상세검색 연산자 버튼 -->
                <div class="form-row">
                    <div class="keyword-section">
                        <div class="keyword-row">
                            <div class="field">
                                <label>키워드</label>
                                <input type="text" id="f-keyword" placeholder="예: 반도체 산업">
                            </div>
                            <div class="op-btns" id="op-btns">
                                <button type="button" class="op-btn" onclick="addSearchRow('quote')" title='정확히 일치 ("")'>&quot;&quot;</button>
                                <button type="button" class="op-btn" onclick="addSearchRow('pipe')"  title='하나 이상 포함 (|)'>|</button>
                                <button type="button" class="op-btn" onclick="addSearchRow('plus')"  title='반드시 포함 (+)'>+</button>
                                <button type="button" class="op-btn" onclick="addSearchRow('minus')" title='제외 (−)'>−</button>
                            </div>
                        </div>
                        <div id="search-ops"></div>
                    </div>
                </div>

                <!-- Row 3: 날짜 + 우선순위 + 제출 -->
                <div class="form-row">
                    <div class="date-pair">
                        <div class="field">
                            <label>시작일 (YYYYMMDD)</label>
                            <input type="text" id="f-start" placeholder="20250101" maxlength="8" pattern="[0-9]{8}" inputmode="numeric" required>
                        </div>
                        <span class="date-sep">~</span>
                        <div class="field">
                            <label>종료일 (YYYYMMDD)</label>
                            <input type="text" id="f-end" placeholder="20251231" maxlength="8" pattern="[0-9]{8}" inputmode="numeric" required>
                        </div>
                    </div>
                    <div class="field f-priority">
                        <label>우선순위</label>
                        <input type="number" id="f-priority" value="0" min="0" max="99" required>
                    </div>
                    <div class="field f-speed">
                        <label title="수집 URL에 동시에 요청을 보낼 속도 (높을수록 빠름)">속도(1~10)</label>
                        <input type="number" id="f-speed" value="3" min="1" max="10" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-ghost" onclick="fillToday()">오늘</button>
                        <button type="submit" class="btn btn-primary">작업 추가</button>
                    </div>
                </div>
            </form>
            <div id="submit-status" class="status-box"></div>
        </div>
    </div>

    <!-- ── Running Jobs ── -->
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">Running Jobs</div>
            <div class="panel-count" id="active-count">0</div>
        </div>
        <div class="panel-body cards" id="active-list">
            <div class="empty">실행 중인 크롤링 없음</div>
        </div>
    </div>

    <!-- ── Queued Jobs ── -->
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">Queued Jobs</div>
            <div class="panel-count" id="queued-count">0</div>
        </div>
        <div class="panel-body cards" id="queued-list">
            <div class="empty">대기 중인 작업 없음</div>
        </div>
    </div>

    <!-- ── Database (크롤 DB 전체 목록) ── -->
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">Database</div>
            <div class="panel-count" id="total-count">0건</div>
        </div>
        <div class="panel-body">
            <form class="filter-bar" onsubmit="event.preventDefault(); currentDbPage=1; loadDbList();">
                <select id="f-db-status" onchange="currentDbPage=1; loadDbList();">
                    <option value="">모든 상태</option>
                    <option value="running">진행중</option>
                    <option value="completed">완료</option>
                    <option value="stopped">중단</option>
                    <option value="error">에러</option>
                </select>
                <input type="text" id="f-db-q" placeholder="키워드 / 요청자 / DB명 검색...">
                <button type="submit" class="btn btn-primary">검색</button>
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('f-db-status').value='';document.getElementById('f-db-q').value='';currentDbPage=1;loadDbList();">초기화</button>
            </form>
        </div>
        <div class="db-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>상태</th>
                        <th>크롤러</th>
                        <th>키워드</th>
                        <th>요청자</th>
                        <th>날짜 범위</th>
                        <th>크기</th>
                        <th>시작</th>
                        <th>액션</th>
                    </tr>
                </thead>
                <tbody id="db-tbody">
                    <tr><td colspan="8"><div class="empty">불러오는 중...</div></td></tr>
                </tbody>
            </table>
        </div>
        <div class="pager">
            <button id="pg-prev" onclick="changeDbPage(-1)">이전</button>
            <span id="pg-info">1 / 1</span>
            <button id="pg-next" onclick="changeDbPage(1)">다음</button>
        </div>
    </div>

</div>

<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this) closeDbDetail()">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="db-detail-title">상세 정보</h3>
            <button class="modal-close" onclick="closeDbDetail()">&times;</button>
        </div>
        <div class="modal-body" id="db-detail-body">불러오는 중...</div>
    </div>
</div>

<div class="modal-overlay" id="save-modal" onclick="if(event.target===this) closeSaveModal()">
    <div class="modal-box">
        <div class="modal-head">
            <h3>데이터 다운로드 — <span id="save-modal-keyword"></span></h3>
            <button class="modal-close" onclick="closeSaveModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p class="detail-label" style="margin-bottom:10px;">매니저 앱의 "CSV로 저장"과 동일하게 매니저 서버가 필터링·압축을 처리합니다.</p>

            <div class="form-field">
                <label>날짜 범위</label>
                <label style="font-weight:400;font-size:12px;margin-right:10px;"><input type="radio" name="save-date-option" value="all" checked onchange="toggleSaveDateRange()"> 전체 기간</label>
                <label style="font-weight:400;font-size:12px;"><input type="radio" name="save-date-option" value="part" onchange="toggleSaveDateRange()"> 기간 지정</label>
            </div>
            <div class="form-field" id="save-date-range" style="display:none;">
                <label>시작일 ~ 종료일 (YYYYMMDD)</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="save-start-date" placeholder="20250101" maxlength="8" style="flex:1;">
                    <input type="text" id="save-end-date" placeholder="20251231" maxlength="8" style="flex:1;">
                </div>
            </div>

            <div class="form-field">
                <label><input type="checkbox" id="save-filter-enabled" onchange="toggleSaveFilterFields()"> 키워드로 필터링</label>
            </div>
            <div id="save-filter-fields" style="display:none;">
                <div class="form-field">
                    <label>포함할 단어 (쉼표로 구분)</label>
                    <input type="text" id="save-incl-words" placeholder="예: 갤럭시, 아이패드">
                </div>
                <div class="form-field">
                    <label>제외할 단어 (쉼표로 구분)</label>
                    <input type="text" id="save-excl-words" placeholder="예: 광고">
                </div>
                <div class="form-field">
                    <label><input type="checkbox" id="save-include-all"> 포함 단어를 모두 만족해야 함 (AND, 미체크 시 OR)</label>
                </div>
                <div class="form-field">
                    <label><input type="checkbox" id="save-filename-edit"> 파일명에 필터 조건 반영</label>
                </div>
            </div>

            <button class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="submitSaveOptions()">다운로드 시작</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="progress-modal">
    <div class="modal-box" style="max-width:640px;">
        <div class="modal-head">
            <h3>다운로드 진행 상황</h3>
            <button class="modal-close" id="progress-close-btn" onclick="closeProgressModal()" style="display:none;">&times;</button>
        </div>
        <div class="modal-body" style="padding:0;">
            <iframe id="progress-iframe" style="width:100%;height:360px;border:none;display:block;"></iframe>
            <div style="padding:14px 20px;">
                <div style="background:#edf1f7;border-radius:8px;height:8px;overflow:hidden;">
                    <div id="dl-progress-bar" style="background:var(--blue);height:100%;width:0%;transition:width 150ms;"></div>
                </div>
                <div id="dl-progress-text" style="font-size:11px;color:var(--muted);margin-top:6px;">서버에 요청 중...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CRAWL_OBJECTS = {
        1:"Naver News", 2:"Naver Blog", 3:"Naver Cafe",
        4:"YouTube", 5:"ChinaDaily", 6:"ChinaSina"
    };

    const CRAWLER_OPTIONS = {
        1:[{v:1,t:"기사+댓글"},{v:2,t:"기사+댓글/대댓글"},{v:3,t:"기사만"},{v:4,t:"기사+댓글(추가정보)"}],
        2:[{v:1,t:"본문+댓글"},{v:2,t:"본문만"}],
        3:[{v:1,t:"본문+댓글"},{v:2,t:"본문만"}],
        4:[{v:1,t:"영상정보+댓글(100개)"},{v:2,t:"영상정보+댓글(무제한)"}],
        5:[{v:1,t:"기사만"}],
        6:[{v:1,t:"기사만"},{v:2,t:"기사+댓글"}],
    };

    const NAVER_IDS = new Set([1, 2, 3]);
    const STATE_TEXT = { running:"진행중", completed:"완료", stopped:"중단", error:"에러" };
    const MANAGER_STATUS_TEXT = { Done:"완료", Error:"에러", Stop:"중단" };
    const LOG_TYPE_LABEL = { start:'시작', info:'정보', error:'에러', end:'종료' };

    const IS_ADMIN = document.body.dataset.isAdmin === 'true';
    const MY_UID = document.body.dataset.myUid || null;

    function getOptionLabel(obj, opt) {
        const o = (CRAWLER_OPTIONS[obj]||[]).find(x => x.v === opt);
        return o ? o.t : String(opt);
    }

    const jobCache    = {};
    const expandedIds = new Set();
    const loadedLogIds = new Set();
    let ws, reconnectTimer;

    function updateOptions() {
        const obj  = Number(document.getElementById('f-object').value);
        const sel  = document.getElementById('f-option');
        const opts = CRAWLER_OPTIONS[obj] || [];
        sel.innerHTML = opts.map(o => `<option value="${o.v}">${o.t}</option>`).join('');

        const isNaver = NAVER_IDS.has(obj);
        document.getElementById('op-btns').classList.toggle('visible', isNaver);
        if (!isNaver) {
            document.getElementById('search-ops').innerHTML = '';
        }
    }

    /* ── 상세검색 연산자 행 추가 ── */
    const OP_META = {
        quote: { tag: '""',  placeholder: '정확히 일치할 문장 (공백 허용)',      noSpace: false },
        pipe:  { tag: '|',   placeholder: '하나 이상 포함할 단어 (공백 불가)',    noSpace: true  },
        plus:  { tag: '+',   placeholder: '반드시 포함할 단어 (공백 불가)',       noSpace: true  },
        minus: { tag: '−',   placeholder: '제외할 단어 (공백 불가)',             noSpace: true  },
    };

    function addSearchRow(type) {
        const meta = OP_META[type];
        const container = document.getElementById('search-ops');
        const row = document.createElement('div');
        row.className = 'search-op-row';
        row.dataset.opType = type;

        row.innerHTML = `
            <span class="search-op-tag">${meta.tag}</span>
            <input class="search-op-input" type="text" placeholder="${meta.placeholder}">
            <button type="button" class="search-op-del" onclick="this.closest('.search-op-row').remove()">✕</button>
        `;

        if (meta.noSpace) {
            row.querySelector('.search-op-input').addEventListener('input', function () {
                const pos = this.selectionStart - (this.value.length - this.value.replace(/\s/g, '').length);
                this.value = this.value.replace(/\s/g, '');
                try { this.setSelectionRange(pos, pos); } catch (_) {}
            });
        }

        container.appendChild(row);
        row.querySelector('.search-op-input').focus();
    }

    /* ── 키워드 조합 ── */
    function buildKeyword() {
        const base  = document.getElementById('f-keyword').value.trim();
        const parts = base ? [base] : [];

        document.querySelectorAll('#search-ops .search-op-row').forEach(row => {
            const type = row.dataset.opType;
            const val  = row.querySelector('.search-op-input').value.trim();
            if (!val) return;
            if      (type === 'quote') parts.push(`"${val}"`);
            else if (type === 'plus')  parts.push(`+${val}`);
            else if (type === 'minus') parts.push(`-${val}`);
            else if (type === 'pipe')  parts.push(`| ${val}`);
        });

        return parts.join(' ');
    }

    function fillToday() {
        const d  = new Date();
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        const v  = `${d.getFullYear()}${mm}${dd}`;
        document.getElementById('f-start').value = v;
        document.getElementById('f-end').value   = v;
    }

    function setStatus(msg, isErr=false) {
        const el = document.getElementById('submit-status');
        el.textContent = msg;
        el.className   = isErr ? 'status-box status-err' : 'status-box status-ok';
        setTimeout(() => { el.className='status-box'; el.textContent=''; }, 3800);
    }

    async function submitJob(e) {
        e.preventDefault();
        const keyword = buildKeyword();
        if (!keyword) {
            setStatus('키워드를 입력해 주세요.', true); return;
        }
        const body = {
            name:          document.getElementById('f-name').textContent.trim(),
            keyword,
            crawl_object:  Number(document.getElementById('f-object').value),
            option_select: Number(document.getElementById('f-option').value),
            start_day:     document.getElementById('f-start').value.trim(),
            end_day:       document.getElementById('f-end').value.trim(),
            priority:      Number(document.getElementById('f-priority').value || 0),
            speed:         Number(document.getElementById('f-speed').value || 5),
        };
        if (!body.name || !body.start_day || !body.end_day) {
            setStatus('필수 필드를 모두 입력해 주세요.', true); return;
        }
        if (body.start_day > body.end_day) {
            setStatus('시작일은 종료일보다 늦을 수 없습니다.', true); return;
        }
        const res  = await fetch('/api/jobs/submit', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) { setStatus(data.detail||'작업 추가에 실패했습니다.', true); return; }
        setStatus(`작업이 추가되었습니다: ${data.job_id}`);
        document.getElementById('f-keyword').value  = '';
        document.getElementById('f-priority').value = '0';
        document.getElementById('f-speed').value    = '3';
        document.getElementById('search-ops').innerHTML = '';
        fillToday();
    }

    function connectWS() {
        const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/api/ws/dashboard`);
        ws.onopen = () => {
            document.getElementById('conn-dot').className  = 'status-dot connected';
            document.getElementById('conn-text').textContent = '실시간 연결';
            if (reconnectTimer) clearTimeout(reconnectTimer);
        };
        ws.onmessage = e => render(JSON.parse(e.data));
        ws.onclose   = () => {
            document.getElementById('conn-dot').className  = 'status-dot disconnected';
            document.getElementById('conn-text').textContent = '연결 끊김';
            reconnectTimer = setTimeout(connectWS, 3000);
        };
        ws.onerror = () => ws.close();
    }

    function render(data) {
        [...(data.active||[]),...(data.queued||[])].forEach(j => { jobCache[j.job_id]=j; });
        renderActive(data.active  || []);
        renderQueued(data.queued  || []);
        // 1초마다 오는 웹소켓 갱신이 카드 HTML을 통째로 새로 그리면서 로그 박스도
        // 매번 빈 상태로 새로 생기므로, 로그를 보고 있던 작업은 다시 불러와 채워준다
        // (덕분에 로그가 접히지 않고 오히려 실시간으로 갱신되는 효과도 생긴다).
        loadedLogIds.forEach(jobId => {
            if (document.getElementById('joblogs-'+jobId)) {
                loadLogs(jobId);
            } else {
                loadedLogIds.delete(jobId);
            }
        });
    }

    function renderActive(jobs) {
        const el = document.getElementById('active-list');
        document.getElementById('active-count').textContent = jobs.length;
        if (!jobs.length) { el.innerHTML='<div class="empty">실행 중인 크롤링 없음</div>'; return; }
        el.innerHTML = jobs.map(job => {
            const cs  = job.crawler_status || {};
            const pct = parseFloat(cs.percentage) || 0;
            const exp = expandedIds.has(job.job_id);
            return `
            <div class="card" onclick="toggleDetail(event,'${job.job_id}')">
                <div class="card-main">
                    <div class="card-left">
                        <div class="job-keyword">${esc(job.keyword)}</div>
                        <div class="job-meta">
                            <span>${esc(CRAWL_OBJECTS[job.crawl_object]||'')}</span>
                            <span>${esc(getOptionLabel(job.crawl_object,job.option_select))}</span>
                            <span>${formatDate(job.start_day)} ~ ${formatDate(job.end_day)}</span>
                            <span>${esc(job.name)}</span>
                        </div>
                        <div class="stats">
                            <span>수집일: ${cs.currentdate||'-'}</span>
                            <span>URL ${cs.urlCnt||0}</span>
                            <span>기사 ${cs.articleCnt||0}</span>
                            <span>댓글 ${cs.commentCnt||0}</span>
                            <span>대댓글 ${cs.replyCnt||0}</span>
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="progress-wrap">
                            <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
                            <div class="progress-text">${pct}%</div>
                        </div>
                        <button class="btn btn-stop" onclick="event.stopPropagation();stopJob('${job.job_id}')">중단</button>
                    </div>
                </div>
                <div class="card-detail${exp?' open':''}" id="detail-${job.job_id}">${exp?renderDetail(job):''}</div>
            </div>`;
        }).join('');
    }

    function renderQueued(jobs) {
        const el = document.getElementById('queued-list');
        document.getElementById('queued-count').textContent = jobs.length;
        if (!jobs.length) { el.innerHTML='<div class="empty">대기 중인 작업 없음</div>'; return; }
        el.innerHTML = jobs.map((job,idx) => {
            const exp = expandedIds.has(job.job_id);
            return `
            <div class="card" onclick="toggleDetail(event,'${job.job_id}')">
                <div class="card-main">
                    <div class="card-left">
                        <div class="job-keyword">${esc(job.keyword)}</div>
                        <div class="job-meta">
                            <span>${esc(CRAWL_OBJECTS[job.crawl_object]||'')}</span>
                            <span>${esc(getOptionLabel(job.crawl_object,job.option_select))}</span>
                            <span>${formatDate(job.start_day)} ~ ${formatDate(job.end_day)}</span>
                            <span>${esc(job.name)}</span>
                        </div>
                    </div>
                    <div class="card-right">
                        <span class="state-badge state-queued">#${idx+1} 대기</span>
                        <button class="btn btn-delete" onclick="event.stopPropagation();deleteJob('${job.job_id}')">삭제</button>
                    </div>
                </div>
                <div class="card-detail${exp?' open':''}" id="detail-${job.job_id}">${exp?renderDetail(job):''}</div>
            </div>`;
        }).join('');
    }

    function renderDetail(job) {
        const items = [
            {label:'Job ID',   val:job.job_id, mono:true},
            {label:'옵션',      val:getOptionLabel(job.crawl_object, job.option_select)},
            {label:'우선순위',  val:String(job.priority??0)},
            {label:'속도',      val:String(job.speed??5)},
        ];
        if (job.started_at)  items.push({label:'시작',    val:new Date(job.started_at).toLocaleString('ko-KR')});
        if (job.finished_at) items.push({label:'완료',    val:new Date(job.finished_at).toLocaleString('ko-KR')});
        if (job.started_at && job.finished_at) {
            const ms   = new Date(job.finished_at)-new Date(job.started_at);
            const mins = Math.floor(ms/60000);
            const secs = Math.floor((ms%60000)/1000);
            items.push({label:'소요 시간', val:`${mins}분 ${secs}초`});
        }
        let html = '<div class="detail-grid">'
            + items.map(it=>`<div>
                <span class="detail-label">${it.label}</span>
                <span class="detail-val${it.mono?' mono':''}">${esc(String(it.val??'-'))}</span>
            </div>`).join('')
            + '</div>';
        if (job.error_message) html += `<div class="detail-error-msg">${esc(job.error_message)}</div>`;
        html += `
            <button class="btn-logs" onclick="event.stopPropagation();loadLogs('${job.job_id}', this)">로그 보기</button>
            <div class="job-logs" id="joblogs-${job.job_id}"></div>`;
        return html;
    }

    async function loadLogs(jobId, btn) {
        const box = document.getElementById('joblogs-'+jobId);
        if (!box) return;
        const isFirstLoad = !loadedLogIds.has(jobId);
        loadedLogIds.add(jobId);
        // 첫 로드일 때만 "불러오는 중" 표시 — 웹소켓 갱신으로 인한 재조회는 박스가
        // 아직 화면에 안 보이는 상태(display:none)라 깜빡임 없이 조용히 채워진다.
        if (isFirstLoad) {
            box.classList.add('open');
            box.innerHTML = '<div class="job-logs-loading">불러오는 중...</div>';
        }
        try {
            const res  = await fetch(`/api/jobs/${jobId}/logs`);
            const data = await res.json();
            const logs = data.logs || [];
            box.classList.add('open');
            if (!logs.length) {
                box.innerHTML = '<div class="job-logs-loading">기록된 로그가 없습니다.</div>';
                return;
            }
            box.innerHTML = logs.map(l => `
                <div class="job-log-row job-log-${esc(l.type)}">
                    <span class="job-log-time">${esc(l.time)}</span>
                    <span class="job-log-type">${esc(LOG_TYPE_LABEL[l.type]||l.type)}</span>
                    <span class="job-log-msg">${esc(l.message)}</span>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        } catch (e) {
            box.innerHTML = '<div class="job-logs-loading">로그를 불러오지 못했습니다.</div>';
        }
    }

    function toggleDetail(e, jobId) {
        if (e.target.tagName==='BUTTON') return;
        if (expandedIds.has(jobId)) {
            expandedIds.delete(jobId);
            loadedLogIds.delete(jobId);
        } else {
            expandedIds.add(jobId);
        }
        const el = document.getElementById('detail-'+jobId);
        if (!el) return;
        if (expandedIds.has(jobId)) {
            el.innerHTML = renderDetail(jobCache[jobId]||{});
            el.classList.add('open');
        } else {
            el.classList.remove('open');
        }
    }

    async function stopJob(jobId) {
        if (!confirm('크롤링을 중단하시겠습니까?')) return;
        await fetch(`/api/jobs/${jobId}/stop`, {method:'POST'});
    }

    async function deleteJob(jobId) {
        if (!confirm('작업을 삭제하시겠습니까?')) return;
        const res = await fetch(`/api/jobs/${jobId}`, {method:'DELETE'});
        if (!res.ok) { const d=await res.json().catch(()=>({})); setStatus(d.detail||'삭제에 실패했습니다.', true); return; }
        setStatus(`작업 ${jobId} 삭제 완료`);
    }

    async function logout() {
        // 로그인은 knpu.re.kr 중앙 로그인이 전담하므로 로그아웃도 그쪽 세션(쿠키)을 지운다.
        // 로그인 페이지가 이 도메인에 따로 없으므로 크롤러 자체 경로로 리다이렉트하면 안 된다.
        await fetch('https://knpu.re.kr/api/auth/logout', {method: 'POST', credentials: 'include'});
        window.location.href = 'https://knpu.re.kr/login?redirect=' + encodeURIComponent(window.location.href);
    }

    function formatDate(d) {
        if (!d||d.length!==8) return d||'-';
        return d.slice(0,4)+'.'+d.slice(4,6)+'.'+d.slice(6,8);
    }

    function esc(s) {
        if (s==null) return '';
        const div = document.createElement('div');
        div.textContent = String(s);
        return div.innerHTML;
    }

    function formatSize(bytes) {
        if (!bytes) return '0 B';
        if (bytes > 1024 ** 3) return (bytes / 1024 ** 3).toFixed(2) + ' GB';
        if (bytes > 1024 ** 2) return (bytes / 1024 ** 2).toFixed(1) + ' MB';
        return (bytes / 1024).toFixed(1) + ' KB';
    }

    function canManage(row) {
        return IS_ADMIN || (MY_UID && row.userUid === MY_UID);
    }

    /* ══════════════ Database 목록 ══════════════ */

    let currentDbPage = 1;
    let totalDbPages = 1;
    const dbPerPage = 20;

    async function loadDbList() {
        const status = document.getElementById('f-db-status').value;
        const q = document.getElementById('f-db-q').value.trim();
        const params = new URLSearchParams({ page: currentDbPage, per_page: dbPerPage });
        if (status) params.set('status', status);
        if (q) params.set('q', q);

        const res = await fetch(`/api/db-list?${params}`);
        if (!res.ok) { setStatus('DB 목록을 불러오지 못했습니다.', true); return; }
        const data = await res.json();

        totalDbPages = Math.max(1, Math.ceil(data.total / dbPerPage));
        document.getElementById('total-count').textContent = `${data.total}건`;
        document.getElementById('pg-info').textContent = `${data.page} / ${totalDbPages}`;
        document.getElementById('pg-prev').disabled = data.page <= 1;
        document.getElementById('pg-next').disabled = data.page >= totalDbPages;

        renderDbTable(data.items);
    }

    function changeDbPage(delta) {
        const next = currentDbPage + delta;
        if (next < 1 || next > totalDbPages) return;
        currentDbPage = next;
        loadDbList();
    }

    let dbRowsByUid = new Map();

    function renderDbTable(items) {
        const tbody = document.getElementById('db-tbody');
        dbRowsByUid = new Map(items.map(row => [row.uid, row]));
        if (!items.length) {
            tbody.innerHTML = '<tr><td colspan="8"><div class="empty">조건에 맞는 DB가 없습니다.</div></td></tr>';
            return;
        }

        tbody.innerHTML = items.map(row => {
            const canResume = ['stopped','error','completed'].includes(row.status) && canManage(row);
            const canDelete = row.status !== 'running' && canManage(row);
            return `
            <tr onclick="openDbDetail('${row.uid}')">
                <td data-label="상태"><span class="state-badge state-${row.status}">${STATE_TEXT[row.status] || row.status}</span></td>
                <td data-label="크롤러">${esc(CRAWL_OBJECTS[row.crawlObject] || '-')}</td>
                <td data-label="키워드" class="keyword-cell">${esc(row.keyword)}</td>
                <td data-label="요청자">${esc(row.requester)}</td>
                <td data-label="날짜 범위" class="muted-cell">${formatDate(row.startDate)} ~ ${formatDate(row.endDate)}</td>
                <td data-label="크기" class="muted-cell">${formatSize(row.dbSize)}</td>
                <td data-label="시작" class="muted-cell">${esc(row.startTime)}</td>
                <td data-label="액션">
                    <div class="actions-cell" onclick="event.stopPropagation()">
                        <button class="btn btn-download" onclick="openSaveOptions('${row.uid}')">다운로드</button>
                        ${canResume ? `<button class="btn btn-resume" onclick="resumeDb('${row.uid}',this)">이어받기</button>` : ''}
                        ${canDelete ? `<button class="btn btn-db-delete" onclick="deleteDb('${row.uid}',this)">삭제</button>` : ''}
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    async function openDbDetail(uid) {
        const modal = document.getElementById('detail-modal');
        const body = document.getElementById('db-detail-body');
        modal.classList.add('open');
        body.innerHTML = '불러오는 중...';

        const [detailRes, logsRes] = await Promise.all([
            fetch(`/api/db-list/${uid}`),
            fetch(`/api/db-list/${uid}/logs`),
        ]);
        if (!detailRes.ok) { body.innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
        const d = await detailRes.json();
        const logsData = await logsRes.json().catch(() => ({logs: []}));

        document.getElementById('db-detail-title').textContent = d.keyword;

        // 이 상세 정보는 manager/server의 GET /crawls/{uid}/info를 그대로 프록시한 것이라
        // status/dbSize/crawlOption 등이 이미 매니저 앱과 동일하게 가공된 표시용 문자열이다
        // (목록(list_db)은 크롤러가 직접 Mongo에서 읽으므로 그쪽 원본 값과 형식이 다르다).
        const stat = d.stat || {};
        const items = [
            { label: 'DB명', val: d.name, mono: true },
            { label: '상태', val: MANAGER_STATUS_TEXT[d.status] || d.status },
            { label: '크롤러', val: d.crawlType || CRAWL_OBJECTS[d.crawlObject] || '-' },
            { label: '옵션', val: String(d.crawlOption) },
            { label: '속도', val: String(d.crawlSpeed ?? '-') },
            { label: '요청자', val: d.requester },
            { label: '날짜 범위', val: `${formatDate(d.startDate)} ~ ${formatDate(d.endDate)}` },
            { label: '마지막 완료일', val: formatDate(d.lastCrawledDate) },
            { label: '기사', val: String(stat.article ?? 0) },
            { label: '댓글', val: String(stat.cmt ?? 0) },
            { label: '대댓글', val: String(stat.reply ?? 0) },
            { label: '크기', val: d.dbSize },
            { label: '시작 시간', val: d.startTime },
            { label: '종료 시간', val: d.endTime },
            { label: 'UID', val: d.uid, mono: true },
        ];

        let html = '<div class="detail-grid">' + items.map(it => `
            <div>
                <span class="detail-label">${esc(it.label)}</span>
                <span class="detail-val${it.mono ? ' mono' : ''}">${esc(it.val ?? '-')}</span>
            </div>`).join('') + '</div>';

        const logs = logsData.logs || [];
        html += '<div style="margin-top:16px;"><span class="detail-label" style="display:block;margin-bottom:6px;">로그</span>';
        if (!logs.length) {
            html += '<div class="empty">기록된 로그가 없습니다.</div>';
        } else {
            html += '<div class="log-box">' + logs.map(l => `
                <div class="log-row log-${esc(l.type)}">
                    <span class="log-time">${esc(l.time)}</span>
                    <span class="log-type">${esc(LOG_TYPE_LABEL[l.type] || l.type)}</span>
                    <span class="log-msg">${esc(l.message)}</span>
                </div>`).join('') + '</div>';
        }
        html += '</div>';

        body.innerHTML = html;
    }

    function closeDbDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    const PROGRESS_BASE = 'https://manager.knpu.re.kr/progress';
    let saveTargetUid = null;
    let saveTargetName = null;

    function openSaveOptions(uid) {
        const row = dbRowsByUid.get(uid) || {};
        saveTargetUid = uid;
        saveTargetName = row.name;
        document.getElementById('save-modal-keyword').textContent = row.keyword;
        document.querySelector('input[name="save-date-option"][value="all"]').checked = true;
        document.getElementById('save-start-date').value = '';
        document.getElementById('save-end-date').value = '';
        document.getElementById('save-filter-enabled').checked = false;
        document.getElementById('save-incl-words').value = '';
        document.getElementById('save-excl-words').value = '';
        document.getElementById('save-include-all').checked = false;
        document.getElementById('save-filename-edit').checked = false;
        toggleSaveDateRange();
        toggleSaveFilterFields();
        document.getElementById('save-modal').classList.add('open');
    }

    function closeSaveModal() {
        document.getElementById('save-modal').classList.remove('open');
    }

    function toggleSaveDateRange() {
        const isPart = document.querySelector('input[name="save-date-option"]:checked').value === 'part';
        document.getElementById('save-date-range').style.display = isPart ? 'block' : 'none';
    }

    function toggleSaveFilterFields() {
        const enabled = document.getElementById('save-filter-enabled').checked;
        document.getElementById('save-filter-fields').style.display = enabled ? 'block' : 'none';
    }

    function splitWords(text) {
        return text.split(',').map(w => w.trim()).filter(Boolean);
    }

    function submitSaveOptions() {
        const dateOption = document.querySelector('input[name="save-date-option"]:checked').value;
        const startDate = document.getElementById('save-start-date').value.trim();
        const endDate = document.getElementById('save-end-date').value.trim();
        if (dateOption === 'part' && (!/^\d{8}$/.test(startDate) || !/^\d{8}$/.test(endDate))) {
            setStatus('기간 지정 시 시작일/종료일을 YYYYMMDD 형식으로 입력해주세요.', true);
            return;
        }

        const filterOption = document.getElementById('save-filter-enabled').checked;

        const option = {
            pid: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`),
            dateOption,
            start_date: dateOption === 'part' ? startDate : '',
            end_date: dateOption === 'part' ? endDate : '',
            filterOption,
            incl_words: filterOption ? splitWords(document.getElementById('save-incl-words').value) : [],
            excl_words: filterOption ? splitWords(document.getElementById('save-excl-words').value) : [],
            include_all: document.getElementById('save-include-all').checked,
            filename_edit: document.getElementById('save-filename-edit').checked,
        };

        closeSaveModal();
        startDownload(saveTargetUid, option, saveTargetName);
    }

    async function startDownload(uid, option, fallbackName) {
        const progressModal = document.getElementById('progress-modal');
        const iframe = document.getElementById('progress-iframe');
        const closeBtn = document.getElementById('progress-close-btn');
        const bar = document.getElementById('dl-progress-bar');
        const text = document.getElementById('dl-progress-text');

        bar.style.width = '0%';
        text.textContent = '서버에 요청 중...';
        closeBtn.style.display = 'none';
        progressModal.classList.add('open');

        try {
            // 매니저 데스크톱 앱과 동일하게, 먼저 progress 서버에 pid를 등록하고 그 뷰어를
            // iframe으로 그대로 띄운다 (manager.knpu.re.kr/progress — 동일한 페이지, 동일한 웹소켓 계약).
            await fetch(`${PROGRESS_BASE}/process`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title: fallbackName || saveTargetUid, process_id: option.pid }),
            });
            iframe.src = `${PROGRESS_BASE}/?pid=${option.pid}`;

            const res = await fetch(`/api/db-list/${uid}/download-via-manager`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(option),
            });
            if (!res.ok) {
                const d = await res.json().catch(() => ({}));
                throw new Error(d.detail || '다운로드에 실패했습니다.');
            }

            const disposition = res.headers.get('content-disposition') || '';
            const star = /filename\*=(?:UTF-8'')?([^;]+)/i.exec(disposition);
            const plain = /filename="?([^";]+)"?/i.exec(disposition);
            const filename = star ? decodeURIComponent(star[1]) : (plain ? plain[1] : `${fallbackName}.zip`);

            const total = Number(res.headers.get('content-length')) || 0;
            const reader = res.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                if (total) {
                    const pct = Math.min(100, Math.round((received / total) * 100));
                    bar.style.width = pct + '%';
                    text.textContent = `다운로드 중... ${pct}% (${formatSize(received)} / ${formatSize(total)})`;
                } else {
                    text.textContent = `다운로드 중... ${formatSize(received)}`;
                }
            }

            const blob = new Blob(chunks);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);

            bar.style.width = '100%';
            text.textContent = `완료: ${filename}`;
            closeBtn.style.display = 'block';
        } catch (e) {
            text.textContent = '오류: ' + e.message;
            closeBtn.style.display = 'block';
        }
    }

    function closeProgressModal() {
        document.getElementById('progress-modal').classList.remove('open');
        document.getElementById('progress-iframe').src = '';
    }

    async function resumeDb(dbUid, btn) {
        const row = dbRowsByUid.get(dbUid) || {};
        const currentEndDay = row.endDate || '';
        const state = row.status;
        let endDate = null;

        if (state === 'completed') {
            const input = prompt(`이미 완료된 크롤링입니다. 이어서 수집할 새 종료일을 입력하세요 (YYYYMMDD)\n현재 종료일: ${formatDate(currentEndDay)}`, '');
            if (!input) return;
            endDate = input.trim();
            if (!/^\d{8}$/.test(endDate)) { setStatus('종료일은 YYYYMMDD 형식으로 입력해주세요.', true); return; }
        } else {
            const input = prompt(`이어받기 종료일 (YYYYMMDD). 비워두면 원래 종료일(${formatDate(currentEndDay)}) 그대로 사용합니다.`, '');
            if (input === null) return;
            const trimmed = input.trim();
            if (trimmed) {
                if (!/^\d{8}$/.test(trimmed)) { setStatus('종료일은 YYYYMMDD 형식으로 입력해주세요.', true); return; }
                endDate = trimmed;
            }
        }

        if (!confirm('마지막으로 완료한 날짜 다음날부터, 같은 파일에 이어서 크롤링을 재개하시겠습니까?')) return;
        if (btn) btn.disabled = true;
        const res = await fetch(`/api/jobs/resume/${dbUid}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ end_date: endDate }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setStatus(data.detail || '이어받기에 실패했습니다.', true); if (btn) btn.disabled = false; return; }
        setStatus(`이어받기 시작됨: ${data.job_id}`);
    }

    async function deleteDb(uid, btn) {
        const row = dbRowsByUid.get(uid) || {};
        if (!confirm(`"${row.keyword}" DB를 완전히 삭제하시겠습니까?\n(파일과 기록이 전부 삭제되며 되돌릴 수 없습니다)`)) return;
        if (btn) btn.disabled = true;
        const res = await fetch(`/api/db-list/${uid}`, { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { setStatus(data.detail || '삭제에 실패했습니다.', true); if (btn) btn.disabled = false; return; }
        setStatus('삭제되었습니다.');
        loadDbList();
    }

    document.getElementById('f-name').textContent = '{{ username }}';
    updateOptions();
    fillToday();
    connectWS();
    loadDbList();

    // Running Jobs처럼 Database 목록도 주기적으로 자동 새로고침한다. 다만 상세/다운로드
    // 모달을 보고 있거나 검색창에 입력 중일 때는 화면이 갑자기 바뀌지 않도록 건너뛴다.
    setInterval(() => {
        const modalOpen = document.querySelector('.modal-overlay.open');
        const searchFocused = document.activeElement === document.getElementById('f-db-q');
        if (!modalOpen && !searchFocused) {
            loadDbList();
        }
    }, 3000);
</script>
