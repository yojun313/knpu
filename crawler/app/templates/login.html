<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="static/pailab_logo_favicon.ico" />
    <title>CRAWLER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0B1226;
            --blue: #416BBF;
            --deep: #2D4473;
            --sky:  #05AFF2;
            --mist: #9AC7D9;

            --ok:       #166534;
            --ok-soft:  #dcfce7;
            --danger:   #b42318;
            --danger-soft: #fde4e2;

            --line: #c8d6e5;
            --shadow: 0 16px 48px rgba(11,18,38,0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif;
            font-weight: 700;
            background: linear-gradient(145deg, var(--navy) 0%, var(--deep) 50%, #1a2d5a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 380px;
        }

        /* ── 카드 ── */
        .login-card {
            width: 100%;
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            border: 1px solid rgba(154,199,217,0.25);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            padding: 28px 24px 24px;
            background: var(--navy);
            border-bottom: 2px solid var(--sky);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .card-header .logo-icon {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(5,175,242,0.40));
        }

        .card-header-text { text-align: center; }

        .card-header h2 {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .card-header p {
            font-size: 12px;
            color: var(--mist);
            margin-top: 4px;
        }

        .card-body {
            padding: 22px 24px 24px;
        }

        /* ── 필드 ── */
        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--blue);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 700;
            background: #f8fafd;
            color: var(--navy);
            transition: border-color 150ms, box-shadow 150ms;
        }
        .field input:focus {
            outline: none;
            border-color: var(--sky);
            box-shadow: 0 0 0 3px rgba(5,175,242,0.15);
            background: #fff;
        }

        /* ── 버튼 ── */
        .btn-primary {
            width: 100%;
            padding: 11px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(65,107,191,0.35);
            transition: filter 150ms, transform 150ms;
        }
        .btn-primary:hover    { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }

        /* ── 메시지 ── */
        .msg {
            font-size: 12px;
            padding: 9px 12px;
            border-radius: 7px;
            margin-bottom: 12px;
            display: none;
            border: 1px solid transparent;
            font-weight: 700;
        }
        .msg-err { display: block; background: var(--danger-soft); color: var(--danger); border-color: #fda29b; }
        .msg-ok  { display: block; background: var(--ok-soft);     color: var(--ok);     border-color: #86efac; }

        .timer {
            font-size: 11px;
            color: var(--blue);
            text-align: right;
            margin-top: -10px;
            margin-bottom: 12px;
        }

        #code-section { display: none; }

        /* ── 하단 ── */
        .footer-text {
            font-size: 11px;
            color: rgba(154,199,217,0.55);
            text-align: center;
            line-height: 1.8;
        }

        .footer-link {
            color: var(--mist);
            text-decoration: none;
            border-bottom: 1px solid rgba(154,199,217,0.4);
            transition: color 150ms, border-color 150ms;
        }
        .footer-link:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="card-header">
            <img src="/static/logo_icon.png" alt="PAILAB" class="logo-icon">
            <div class="card-header-text">
                <h2>CRAWLER Dashboard</h2>
                <p>로그인하여 크롤링 작업을 관리하세요</p>
            </div>
        </div>
        <div class="card-body">

            <div id="name-section">
                <div class="field">
                    <label>이름</label>
                    <input type="text" id="name" placeholder="등록된 이름을 입력하세요" autocomplete="name">
                </div>
                <div class="msg" id="name-error"></div>
                <button class="btn-primary" onclick="requestCode()">인증코드 요청</button>
            </div>

            <div id="code-section">
                <div class="msg" id="code-sent"></div>
                <div class="field">
                    <label>인증코드</label>
                    <input type="text" id="code" placeholder="이메일로 전송된 6자리 코드" maxlength="6" inputmode="numeric">
                </div>
                <div class="timer" id="timer"></div>
                <div class="msg" id="code-error"></div>
                <button class="btn-primary" onclick="verifyCode()">로그인</button>
            </div>

        </div>
    </div>

    <p class="footer-text">
        KNPU PAILAB &nbsp;·&nbsp; CRAWLER System<br>
        <a href="https://knpu.re.kr" target="_blank" class="footer-link">knpu.re.kr</a>
    </p>
</div>

<script>
    let timerInterval;

    async function requestCode() {
        const name    = document.getElementById('name').value.trim();
        const errorEl = document.getElementById('name-error');
        errorEl.className = 'msg';
        if (!name) return;

        try {
            const res  = await fetch('/auth/request-code', {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})
            });
            const data = await res.json();
            if (!res.ok) { errorEl.textContent=data.detail||'오류가 발생했습니다'; errorEl.className='msg msg-err'; return; }

            document.getElementById('name-section').style.display = 'none';
            document.getElementById('code-section').style.display = 'block';

            const sentEl = document.getElementById('code-sent');
            sentEl.textContent = '인증코드를 이메일로 전송했습니다';
            sentEl.className = 'msg msg-ok';

            let remaining = 300;
            timerInterval = setInterval(() => {
                remaining--;
                const m = Math.floor(remaining/60);
                const s = remaining%60;
                document.getElementById('timer').textContent = `${m}:${String(s).padStart(2,'0')}`;
                if (remaining<=0) { clearInterval(timerInterval); document.getElementById('timer').textContent='코드 만료됨'; }
            }, 1000);
        } catch {
            errorEl.textContent='서버 연결 실패'; errorEl.className='msg msg-err';
        }
    }

    async function verifyCode() {
        const name    = document.getElementById('name').value.trim();
        const code    = document.getElementById('code').value.trim();
        const errorEl = document.getElementById('code-error');
        errorEl.className = 'msg';
        if (!code) return;

        try {
            const res = await fetch('/auth/verify-code', {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, code})
            });
            if (res.ok) { clearInterval(timerInterval); window.location.href='/'; return; }
            const data = await res.json();
            errorEl.textContent = data.detail||'인증 실패';
            errorEl.className = 'msg msg-err';
        } catch {
            errorEl.textContent='서버 연결 실패'; errorEl.className='msg msg-err';
        }
    }

    document.getElementById('name').addEventListener('keypress', e => { if (e.key==='Enter') requestCode(); });
    document.getElementById('code').addEventListener('keypress', e => { if (e.key==='Enter') verifyCode(); });
</script>
</body>
</html>
