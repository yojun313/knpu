{% extends "base.html" %}
{% block content %}
<div class="h-full flex items-center justify-center">
    <div class="card p-8 rounded-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2">Verify Code</h2>
        <p class="text-zinc-400 text-sm mb-6">Enter the 6-digit code sent to your email.</p>
        <form method="POST" action="/verify">
            <input type="hidden" name="name" value="{{ name }}">
            <input type="text" name="code" placeholder="6-digit code" required
                   class="w-full bg-[#09090b] border border-zinc-700 rounded-md px-4 py-3 text-zinc-200 mb-4 tracking-widest text-center text-xl focus:outline-none focus:border-zinc-500">
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-500 transition">
                Verify and Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
