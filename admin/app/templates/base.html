<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KNPU Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 페인트 전에 테마를 정해서 깜빡임(FOUC)을 막는다.
        (function () {
            var saved = localStorage.getItem('admin-theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
        
        const THEME_COOKIE_KEY = 'ui_theme_style';

        function themeCookieDomainAttr() {
            return /(^|\.)knpu\.re\.kr$/.test(location.hostname) ? '; domain=.knpu.re.kr' : '';
        }

        function currentUiTheme() {
            try {
                const m = document.cookie.match(/(?:^|; )ui_theme_style=([^;]*)/);
                return m ? decodeURIComponent(m[1]) : 'default';
            } catch (e) { return 'default'; }
        }

        function applyUiTheme(id) {
            if (id === 'default') document.documentElement.removeAttribute('data-ui-theme');
            else document.documentElement.setAttribute('data-ui-theme', id);
            try {
                const maxAge = 60 * 60 * 24 * 365;
                document.cookie = THEME_COOKIE_KEY + '=' + encodeURIComponent(id) +
                    '; path=/; max-age=' + maxAge + '; samesite=lax' +
                    themeCookieDomainAttr() + (location.protocol === 'https:' ? '; secure' : '');
            } catch (e) { /* noop */ }
        }

        const THEME_MODE_COOKIE_KEY = 'ui_theme_mode';

        function currentUiThemeMode() {
            try {
                const m = document.cookie.match(/(?:^|; )ui_theme_mode=([^;]*)/);
                return m ? decodeURIComponent(m[1]) : 'light';
            } catch (e) { return 'light'; }
        }

        function applyUiThemeMode(mode) {
            if (mode === 'dark') document.documentElement.setAttribute('data-ui-theme-mode', 'dark');
            else document.documentElement.removeAttribute('data-ui-theme-mode');
            try {
                const maxAge = 60 * 60 * 24 * 365;
                document.cookie = THEME_MODE_COOKIE_KEY + '=' + encodeURIComponent(mode) +
                    '; path=/; max-age=' + maxAge + '; samesite=lax' +
                    themeCookieDomainAttr() + (location.protocol === 'https:' ? '; secure' : '');
            } catch (e) { /* noop */ }
        }

        (function(){
            try{
                var v=currentUiTheme();
                if(v&&v!=='default')document.documentElement.setAttribute('data-ui-theme',v);
                if(currentUiThemeMode()==='dark')document.documentElement.setAttribute('data-ui-theme-mode','dark');
            }catch(e){}
        })();
    </script>
    <link rel="stylesheet" href="/shared-ui/theme.css">
    <style>
        /* 데스크톱 MANAGER 앱(kemkim/network 뷰어와 같은 뿌리) 배색 그대로 가져옴 */
        :root {
            --accent: #34495e;
            --brand: #eaeaea;
            --panel: #323232;
            --panel2: #3c3c3c;
            --line: #5a5a5a;
            --muted: #9a9a9a;
            --ink: #ffffff;
            --success: #4CAF50;
            --danger: #E74C3C;
            --warn: #e08a2e;
        }
        :root[data-theme="light"] {
            --accent: #2c3e50;
            --brand: #2c3e50;
            --panel: #f7f8f9;
            --panel2: #ecf0f1;
            --line: #bdc3c7;
            --muted: #7c8896;
            --ink: #16212c;
        }

        /* ── 기본 ── */
        body { background-color: #202124; color: var(--ink); }
        :root[data-theme="light"] body { background-color: #ecf0f1; }

        .sidebar { background-color: var(--panel); border-right: 1px solid var(--line); }
        .card { background-color: var(--panel); border: 1px solid var(--line); }
        .list-item { border-bottom: 1px solid var(--line); }
        .list-item:last-child { border-bottom: none; }
        .nav-item { color: var(--muted); transition: all 0.2s; }
        .nav-item:hover { background-color: var(--panel2); color: var(--ink); }
        .nav-item.active { background-color: var(--accent); color: #fff; }
        .brand-mark { color: var(--brand); }

        #sidebar { transition: transform 0.3s ease-in-out; }

        /* Tailwind CDN이 만드는 zinc/black/white 계열 유틸리티를 클래스 부분일치로 잡아서
           덮어쓴다 — bg-zinc-900/40처럼 투명도가 붙은 변형도 문자열엔 "zinc-900"이 그대로
           들어있으므로 [class*="..."]로만 잡을 수 있다(정확히 일치하는 선택자로는 안 잡힘). */
        [class*="bg-zinc-900"],
        [class*="bg-zinc-950"],
        [class*="bg-\[\#09090b\]"] { background-color: var(--panel) !important; }
        [class*="bg-zinc-800"] { background-color: var(--panel2) !important; }
        [class*="bg-black"] { background-color: var(--panel) !important; }

        [class*="text-white"] { color: var(--ink) !important; }
        [class*="text-zinc-100"],
        [class*="text-zinc-200"] { color: var(--ink) !important; }
        [class*="text-zinc-300"] { color: var(--ink) !important; opacity: 0.85; }
        [class*="text-zinc-400"] { color: var(--muted) !important; }
        [class*="text-zinc-500"],
        [class*="text-zinc-600"] { color: var(--muted) !important; }
        [class*="text-zinc-700"] { color: var(--line) !important; }

        [class*="border-zinc-700"],
        [class*="border-zinc-800"],
        [class*="border-zinc-900"] { border-color: var(--line) !important; }

        input, select, textarea { color: var(--ink) !important; background-color: transparent; }
        :root[data-theme="light"] input,
        :root[data-theme="light"] select,
        :root[data-theme="light"] textarea { background-color: #ffffff !important; }
        ::placeholder { color: var(--muted) !important; opacity: 0.8; }

        [class*="hover\:bg-zinc-800"]:hover,
        [class*="hover\:bg-zinc-900"]:hover { background-color: var(--panel2) !important; }

        /* 작은 상태 표시등(dot)만 Flat UI 색으로 — 배지 배경+글자색을 동시에 건드리면
           같은 색끼리 겹쳐 글자가 안 보이게 되므로 배지 전체 배색은 건드리지 않는다. */
        .w-1\.5.bg-green-500, .w-2.bg-green-500,
        .w-1\.5.bg-emerald-500, .w-2.bg-emerald-500 { background-color: var(--success) !important; }
        .w-1\.5.bg-red-500, .w-2.bg-red-500 { background-color: var(--danger) !important; }
        .w-1\.5.bg-amber-500, .w-2.bg-amber-500 { background-color: var(--warn) !important; }

        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 8px;
            color: inherit; opacity: 0.7; transition: opacity 0.2s, background-color 0.2s;
        }
        .theme-toggle:hover { opacity: 1; background-color: rgba(127,127,127,0.15); }
        .icon-sun { display: none; }
        :root[data-theme="light"] .icon-moon { display: none; }
        :root[data-theme="light"] .icon-sun { display: block; }

        /* ── 글래스모피즘/뉴모피즘/그라디언트 메시 스킨 ─────────────────────────
           이 페이지는 --panel/--panel2/--line/--ink/--muted/--accent/--brand 이
           7개 변수(위 :root, :root[data-theme="light"])와, 그 변수를 참조하는
           Tailwind zinc 계열 부분일치 선택자들로 전체 배색을 관리한다. 테마별로
           같은 변수만 다시 정의하면 사이드바/카드/텍스트가 전부 자동으로
           갈아입으므로, 셀렉터를 새로 나열할 필요 없이 변수만 덮어쓴다.
           body 배경만은 그라디언트/블롭처럼 --panel과 다른 값이 필요해 따로 지정한다.
           각 테마는 data-ui-theme-mode="dark"로 다크 배리언트를 켤 수 있다. 글래스
           라이트 모드는 배경이 밝으므로 --ink를 어둡게 둬야 한다(전에는 흰 글자를 써서
           흰 배경 위에 아무것도 안 보이는 버그가 있었다). */
        :root[data-ui-theme="glass"]:not([data-ui-theme-mode="dark"]) {
            --accent: #7c6fd6; --brand: #3a4256;
            --panel: rgba(255,255,255,0.62); --panel2: rgba(255,255,255,0.78);
            --line: rgba(255,255,255,0.7); --muted: #626c7b; --ink: #262d38;
        }
        :root[data-ui-theme="glass"][data-ui-theme-mode="dark"] {
            --accent: #7c9ce8; --brand: #cdd4e4;
            --panel: rgba(255,255,255,0.07); --panel2: rgba(255,255,255,0.12);
            --line: rgba(255,255,255,0.14); --muted: #99a1b2; --ink: #dde1ea;
        }
        :root[data-ui-theme="glass"]:not([data-ui-theme-mode="dark"]) body {
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.3), transparent 45%),
                linear-gradient(135deg, #cfd9ec 0%, #d8d2e8 45%, #e6d9e2 100%) !important;
            background-attachment: fixed;
        }
        :root[data-ui-theme="glass"][data-ui-theme-mode="dark"] body {
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 45%),
                linear-gradient(135deg, #1b2130 0%, #201e2c 50%, #241f27 100%) !important;
            background-attachment: fixed;
        }
        :root[data-ui-theme="glass"] .sidebar,
        :root[data-ui-theme="glass"] .card,
        :root[data-ui-theme="glass"] [class*="bg-zinc-900"],
        :root[data-ui-theme="glass"] [class*="bg-zinc-950"],
        :root[data-ui-theme="glass"] [class*="bg-\[\#09090b\]"],
        :root[data-ui-theme="glass"] [class*="bg-zinc-800"],
        :root[data-ui-theme="glass"] [class*="bg-black"] {
            background: var(--panel) !important;
            backdrop-filter: blur(16px) saturate(130%);
            -webkit-backdrop-filter: blur(16px) saturate(130%);
            border-color: var(--line) !important;
        }

        :root[data-ui-theme="neu"]:not([data-ui-theme-mode="dark"]) {
            --accent: #5b7fdb; --brand: #4a5568;
            --panel: #e7e9ee; --panel2: #dfe2e8;
            --line: transparent; --muted: #6b7280; --ink: #2d3748;
            --neu-dark: #d1d4da; --neu-light: #ffffff;
        }
        :root[data-ui-theme="neu"][data-ui-theme-mode="dark"] {
            --accent: #7c96d9; --brand: #d3d6de;
            --panel: #2b2e37; --panel2: #313540;
            --line: transparent; --muted: #8b93a3; --ink: #d7dae2;
            --neu-dark: #212329; --neu-light: #353a46;
        }
        :root[data-ui-theme="neu"] body { background: var(--panel) !important; }
        :root[data-ui-theme="neu"] .sidebar,
        :root[data-ui-theme="neu"] .card,
        :root[data-ui-theme="neu"] [class*="bg-zinc-900"],
        :root[data-ui-theme="neu"] [class*="bg-zinc-950"],
        :root[data-ui-theme="neu"] [class*="bg-\[\#09090b\]"],
        :root[data-ui-theme="neu"] [class*="bg-zinc-800"],
        :root[data-ui-theme="neu"] [class*="bg-black"] {
            background: var(--panel) !important;
            border: none !important;
            box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
        }
        :root[data-ui-theme="neu"] .nav-item.active {
            background-color: transparent !important;
            color: var(--accent) !important;
            box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
        }

        :root[data-ui-theme="mesh"]:not([data-ui-theme-mode="dark"]) {
            --accent: #4f9dc9; --brand: #3a4256;
            --panel: rgba(255,255,255,0.5); --panel2: rgba(255,255,255,0.68);
            --line: rgba(255,255,255,0.65); --muted: #626c7b; --ink: #262d38;
            --mesh-base: #eef0f4;
            --mesh-1: rgba(109,92,232,0.14); --mesh-2: rgba(34,211,238,0.12);
            --mesh-3: rgba(240,163,207,0.12); --mesh-4: rgba(246,205,158,0.1);
        }
        :root[data-ui-theme="mesh"][data-ui-theme-mode="dark"] {
            --accent: #22d3ee; --brand: #dde0ea;
            --panel: rgba(255,255,255,0.05); --panel2: rgba(255,255,255,0.09);
            --line: rgba(255,255,255,0.13); --muted: #96a0b3; --ink: #e0e3ea;
            --mesh-base: #14151f;
            --mesh-1: rgba(109,92,232,0.28); --mesh-2: rgba(34,211,238,0.22);
            --mesh-3: rgba(240,163,207,0.2); --mesh-4: rgba(246,205,158,0.16);
        }
        :root[data-ui-theme="mesh"] body { background: var(--mesh-base) !important; }
        :root[data-ui-theme="mesh"] body::before {
            content: "";
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(circle at 15% 20%, var(--mesh-1), transparent 45%),
                radial-gradient(circle at 85% 15%, var(--mesh-2), transparent 45%),
                radial-gradient(circle at 25% 85%, var(--mesh-3), transparent 45%),
                radial-gradient(circle at 80% 80%, var(--mesh-4), transparent 45%),
                var(--mesh-base);
            animation: themeMeshHue 30s linear infinite;
        }
        @keyframes themeMeshHue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        :root[data-ui-theme="mesh"] .sidebar,
        :root[data-ui-theme="mesh"] .card,
        :root[data-ui-theme="mesh"] [class*="bg-zinc-900"],
        :root[data-ui-theme="mesh"] [class*="bg-zinc-950"],
        :root[data-ui-theme="mesh"] [class*="bg-\[\#09090b\]"],
        :root[data-ui-theme="mesh"] [class*="bg-zinc-800"],
        :root[data-ui-theme="mesh"] [class*="bg-black"] {
            background: var(--panel) !important;
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            border-color: var(--line) !important;
        }

        /* ── 다크 모드 토글 스위치 (settings.html에서 사용) ─────────────────── */
        .theme-mode-switch {
            position: relative; width: 40px; height: 22px; border-radius: 999px;
            background: rgba(127,127,127,0.32); border: none; cursor: pointer; flex-shrink: 0;
            transition: background 150ms;
        }
        .theme-mode-switch::before {
            content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
            border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
            transition: transform 150ms;
        }
        .theme-mode-switch.on { background: var(--accent); }
        .theme-mode-switch.on::before { transform: translateX(18px); }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-[#09090b]">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden"></div>

    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-64 flex-shrink-0 flex flex-col h-full z-50 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0">
        <div class="p-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold"><span class="brand-mark">KNPU</span></h1>
                <p class="text-xs text-zinc-500 mt-1">System Analytics</p>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <nav id="sidebarNav" class="flex-1 px-4 space-y-2 overflow-y-auto">
            {% for item in get_nav_items() %}
            <a data-nav-id="{{ item.id }}" href="{{ item.href }}" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == item.id %}active{% endif %}">{{ item.label }}</a>
            {% endfor %}
        </nav>

        <div class="p-4 border-t border-zinc-800 flex items-center justify-between gap-2">
            <a href="#" onclick="logout(event)" class="nav-item flex-1 flex items-center px-4 py-2 rounded-md text-sm">Logout</a>
            <a href="/settings" class="theme-toggle {% if active_page == 'settings' %}active{% endif %}" title="메뉴 순서 설정">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <header class="lg:hidden flex items-center justify-between p-4 border-b border-zinc-800 bg-[#09090b]">
            <h1 class="text-lg font-bold"><span class="brand-mark">KNPU</span></h1>
            <button onclick="toggleSidebar()" class="p-2 text-zinc-400 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        async function logout(e) {
            e.preventDefault();
            try {
                await fetch('https://knpu.re.kr/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include',
                });
            } finally {
                window.location.href = 'https://knpu.re.kr/login?redirect=' + encodeURIComponent(window.location.href);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('-translate-x-full');

            if (sidebar.classList.contains('-translate-x-full')) {
                overlay.classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('sidebarOverlay').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('-translate-x-full');
            } else {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        });
    </script>
</body>
</html>
