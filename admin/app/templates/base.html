<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAILAB Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; }
        .sidebar { background-color: #09090b; border-right: 1px solid #27272a; }
        .card { background-color: #09090b; border: 1px solid #27272a; }
        .list-item { border-bottom: 1px solid #27272a; }
        .list-item:last-child { border-bottom: none; }
        .nav-item { color: #a1a1aa; }
        .nav-item:hover, .nav-item.active { background-color: #27272a; color: #fafafa; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="sidebar w-64 flex-shrink-0 flex flex-col h-full">
        <div class="p-6">
            <h1 class="text-xl font-bold">PAILAB Dashboard</h1>
            <p class="text-xs text-zinc-500 mt-1">System Analytics</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="/" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'overview' %}active{% endif %}">Overview</a>
            <a href="/logs" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'logs' %}active{% endif %}">User Logs</a>
            <a href="/bugs" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'user_bugs' %}active{% endif %}">User Bugs</a>
            <a href="/crawlers" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'crawlers' %}active{% endif %}">Crawler DB</a>
            <a href="/bug-reports" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'bugs' %}active{% endif %}">Bug Reports</a>
            <a href="/users" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'users' %}active{% endif %}">Users</a>
        </nav>
        <div class="p-4">
            <a href="#" class="nav-item flex items-center px-4 py-2 rounded-md text-sm">Logout</a>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
