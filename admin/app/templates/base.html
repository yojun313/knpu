<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPEI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; }
        .sidebar { background-color: #09090b; border-right: 1px solid #27272a; }
        .card { background-color: #09090b; border: 1px solid #27272a; }
        .list-item { border-bottom: 1px solid #27272a; }
        .list-item:last-child { border-bottom: none; }
        .nav-item { color: #a1a1aa; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: #27272a; color: #fafafa; }
        
        /* 모바일 사이드바 트랜지션 */
        #sidebar { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-[#09090b]">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden"></div>

    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-64 flex-shrink-0 flex flex-col h-full z-50 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0">
        <div class="p-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">FPEI</h1>
                <p class="text-xs text-zinc-500 mt-1">System Analytics</p>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
            <a href="/" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'overview' %}active{% endif %}">Overview</a>            
            <a href="/logs" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'logs' %}active{% endif %}">User Logs</a>
            <a href="/bugs" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'user_bugs' %}active{% endif %}">User Bugs</a>
            <a href="/crawlers" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'crawlers' %}active{% endif %}">Crawler DB</a>
            <a href="/bug-reports" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'bugs' %}active{% endif %}">Bug Reports</a>
            <a href="/users" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'users' %}active{% endif %}">Users</a>
            <a href="/process" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'process' %}active{% endif %}">Servers</a>
            <a href="/nginx" class="nav-item flex items-center px-4 py-2 rounded-md text-sm {% if active_page == 'nginx' %}active{% endif %}">Domains</a>
        </nav>

        <div class="p-4 border-t border-zinc-800">
            <a href="#" onclick="logout(event)" class="nav-item flex items-center px-4 py-2 rounded-md text-sm">Logout</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <header class="lg:hidden flex items-center justify-between p-4 border-b border-zinc-800 bg-[#09090b]">
            <h1 class="text-lg font-bold">FPEI</h1>
            <button onclick="toggleSidebar()" class="p-2 text-zinc-400 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        async function logout(e) {
            e.preventDefault();
            try {
                await fetch('https://knpu.re.kr/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include',
                });
            } finally {
                window.location.href = 'https://knpu.re.kr/login';
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            // 사이드바 이동
            sidebar.classList.toggle('-translate-x-full');
            
            // 오버레이 토글
            if (sidebar.classList.contains('-translate-x-full')) {
                overlay.classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
            }
        }

        // 화면 크기가 커지면 오버레이와 모바일 사이드바 상태 강제 초기화
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('sidebarOverlay').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('-translate-x-full');
            } else {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        });
    </script>
</body>
</html>
